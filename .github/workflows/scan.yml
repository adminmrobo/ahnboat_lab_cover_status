name: 표지 현황 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국 시간 오전 6시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cover-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 저장소 표지 현황 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scan_repos.py

      - name: 바뀐 것이 있으면 커밋
        run: |
          # 날짜(checked_at)만 바뀐 경우는 커밋하지 않는다
          if [ -z "$(git diff -U0 -- data/ | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '"checked_at"')" ]; then
            echo "변경 없음"
            git checkout -- data/
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "표지 현황 자동 수집 $(TZ=Asia/Seoul date +%F)"
          git push
