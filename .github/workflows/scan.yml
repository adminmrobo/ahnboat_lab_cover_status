name: 표지 현황 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국 시간 오전 6시
  workflow_dispatch:
  push:                    # 엑셀로 고친 현황판 표를 올리면 바로 다시 만든다
    branches: [main]
    paths: ["data/hub.csv.enc", "data/hub_meta.json", "data/portfolio.csv", "data/portfolio_meta.json", ".github/workflows/scan.yml"]

permissions:
  contents: write

concurrency:
  group: cover-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 저장소 표지 현황 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scan_repos.py

      - name: 바뀐 저장소의 대표 그림 썸네일 다시 만들기
        run: |
          pip install --quiet pillow
          python scripts/make_thumbs.py --fetch

      - name: 콘텐츠 현황판 DB와 서버실 목록 만들기 (관리 데이터는 관리자 키로 잠금)
        env:
          HUB_KEY: ${{ secrets.HUB_KEY }}
        run: |
          pip install --quiet cryptography
          python scripts/hub_secure.py
          python scripts/build_portfolio.py
          python scripts/build_ontology.py   # 공개 콘텐츠 지식 색인 → 분야별 온톨로지 지도 데이터
          # 평문 관리 데이터가 남아 있으면 멈춘다
          if [ -e data/hub.csv ] || [ -e data/hub.json ]; then
            if [ -n "$HUB_KEY" ]; then echo "평문 관리 데이터가 남아 있습니다"; exit 1; fi
          fi

      - name: 바뀐 것이 있으면 커밋
        env:
          HUB_KEY: ${{ secrets.HUB_KEY }}
        run: |
          # 날짜(checked_at, updated)만 바뀐 경우는 커밋하지 않는다. 파일이 새로 생기거나 지워지면 커밋한다.
          if [ -z "$(git diff -U0 HEAD -- data/ | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '"checked_at"' | grep -v '"updated"')" ] \
             && [ -z "$(git status --porcelain -- data/ thumbs/ | grep -v '^ M')" ]; then
            echo "변경 없음"
            git checkout -- data/
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ thumbs/
          git commit -m "표지 현황 자동 수집 $(TZ=Asia/Seoul date +%F)"
          # 수집하는 동안(몇 분) 다른 커밋이 먼저 올라오면 push가 거절된다.
          # 그때는 이번 수집 결과(repos.json · 대표 그림)만 지키고, 사람이 고친 파일은 최신 것을 받아
          # 카탈로그·서버실 목록·온톨로지를 다시 만든 뒤 다시 올린다 (최대 5번).
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "다른 커밋이 먼저 올라옴 — 최신을 받아 다시 만든다 ($i)"
            rm -rf /tmp/scan && mkdir -p /tmp/scan
            cp data/repos.json /tmp/scan/repos.json && cp -r thumbs/repos /tmp/scan/thumbs_repos
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/scan/repos.json data/repos.json && rm -rf thumbs/repos && cp -r /tmp/scan/thumbs_repos thumbs/repos
            python scripts/hub_secure.py
            python scripts/build_portfolio.py
            python scripts/build_ontology.py
            if [ -e data/hub.csv ] || [ -e data/hub.json ]; then
              if [ -n "$HUB_KEY" ]; then echo "평문 관리 데이터가 남아 있습니다"; exit 1; fi
            fi
            git add -A data/ thumbs/
            git diff --cached --quiet && { echo "받은 최신에 이미 다 들어 있음"; exit 0; }
            git commit -q -m "표지 현황 자동 수집 $(TZ=Asia/Seoul date +%F)"
            sleep $((i * 5))
          done
          exit 1
