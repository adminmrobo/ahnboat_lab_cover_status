name: 표지 현황 수집

on:
  schedule:
    # 하루 두 번. GitHub 예약 실행은 정각 무렵 몰려서 3~6시간씩 밀린다(06:00로 걸었을 때 실제 09~12시).
    # 그래서 정각을 피한 분에, 아침·저녁 전에 끝나도록 일찍 건다.
    - cron: "27 18 * * *"   # 한국 시간 새벽 3시 27분 → 보통 아침 안에 실행
    - cron: "27 6 * * *"    # 한국 시간 오후 3시 27분 → 보통 저녁 안에 실행
  workflow_dispatch:
  push:                    # 엑셀로 고친 현황판 표를 올리면 바로 다시 만든다
    branches: [main]
    paths: ["data/hub.csv.enc", "scripts/build_updates.py", "data/publish_settings.json", "data/hub_meta.json", "data/rack_migration.json", "data/views.json", "data/portfolio.csv", "data/portfolio_meta.json", "data/pixel_audit.json", ".github/workflows/scan.yml"]

permissions:
  contents: write

concurrency:
  group: cover-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 저장소 표지 현황 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scan_repos.py

      - name: 바뀐 저장소의 대표 그림 썸네일 다시 만들기
        run: |
          pip install --quiet pillow
          python scripts/make_thumbs.py --fetch
          # 대표 표지의 실제 픽셀 크기 → 저해상도 점검(data/cover_res.json, 관리실 '점검 · 번역' 탭) — 실패해도 수집은 계속
          python scripts/cover_res.py || echo "표지 해상도 점검 실패 — 다음 수집 때 다시"

      - name: 콘텐츠 현황판 DB와 서버실 목록 만들기 (관리 데이터는 관리자 키로 잠금)
        env:
          HUB_KEY: ${{ secrets.ADMIN_PASSWORD || secrets.HUB_KEY }}   # 관리자 비밀번호(ADMIN_PASSWORD)가 있으면 그것이 관리자 키
          HUB_KEY_OLD: ${{ secrets.HUB_KEY }}
          ADMIN_SET: ${{ secrets.ADMIN_PASSWORD != '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 그림 점검이 저장소 파일 목록을 읽는다
        run: |
          pip install --quiet cryptography networkx numpy scipy
          python scripts/rekey.py   # 예전 키(HUB_KEY)로 잠긴 파일을 새 관리자 키(ADMIN_PASSWORD)로 다시 잠근다
          python -c "import sys; sys.path.insert(0, 'scripts'); import series_cards; series_cards.fetch()"   # 시리즈 카드(장별 묶음) 최신본
          python scripts/hub_secure.py
          python scripts/build_portfolio.py
          python scripts/build_updates.py    # 업데이트 이력 → 홈페이지 자동 공지(data/notices_auto.csv, 하루 최대 4건 · 용량 큰 순서)
          python scripts/build_ontology.py   # 공개 콘텐츠 지식 색인 → 분야별 온톨로지 지도 데이터
          python scripts/build_i18n_status.py   # 언어별 콘텐츠 번역률(홈페이지 언어 버튼 아래) · 끝난 번역 요청 '완료' 표시
          python scripts/build_growth.py     # 온톨로지 → 'Reon Ahn Page 지식 노드 현황'(growth.html) 데이터 · 하루의 이번 주 읽기
          python scripts/build_growth_crime.py   # ai_crime_lab data/crime_kg.json → 'AI 범죄학 지식 노드 현황'(growth_crime.html) 데이터
          # 그림 점검(pixel.html): 페이지마다 픽셀 깨짐 보정 코드 유무 — 실패해도 수집은 계속, 기록은 관리자 키로 잠근다
          python scripts/pixel_check.py || { echo "그림 점검 실패 — 다음 수집 때 다시"; python scripts/pixel_check.py --lock-only; }
          # 평문 관리 데이터가 남아 있으면 멈춘다
          if [ -e data/hub.csv ] || [ -e data/hub.json ] || [ -e data/pixel_audit.json ]; then
            if [ -n "$HUB_KEY" ]; then echo "평문 관리 데이터가 남아 있습니다"; exit 1; fi
          fi

      - name: 바뀐 것이 있으면 커밋
        env:
          HUB_KEY: ${{ secrets.ADMIN_PASSWORD || secrets.HUB_KEY }}   # 관리자 비밀번호(ADMIN_PASSWORD)가 있으면 그것이 관리자 키
          HUB_KEY_OLD: ${{ secrets.HUB_KEY }}
          ADMIN_SET: ${{ secrets.ADMIN_PASSWORD != '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 그림 점검이 저장소 파일 목록을 읽는다
        run: |
          # 날짜(checked_at, updated)만 바뀐 경우는 커밋하지 않는다. 파일이 새로 생기거나 지워지면 커밋한다.
          if [ -z "$(git diff -U0 HEAD -- data/ | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '"checked_at"' | grep -v '"updated"')" ] \
             && [ -z "$(git status --porcelain -- data/ thumbs/ | grep -v '^ M')" ]; then
            echo "변경 없음"
            git checkout -- data/
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ thumbs/
          git commit -m "표지 현황 자동 수집 $(TZ=Asia/Seoul date +%F)"
          # 수집하는 동안(몇 분) 다른 커밋이 먼저 올라오면 push가 거절된다.
          # 그때는 이번 수집 결과(repos.json · 대표 그림)만 지키고, 사람이 고친 파일은 최신 것을 받아
          # 카탈로그·서버실 목록·온톨로지를 다시 만든 뒤 다시 올린다 (최대 5번).
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "다른 커밋이 먼저 올라옴 — 최신을 받아 다시 만든다 ($i)"
            rm -rf /tmp/scan && mkdir -p /tmp/scan
            cp data/repos.json /tmp/scan/repos.json && cp -r thumbs/repos /tmp/scan/thumbs_repos
            cp data/cover_res.json /tmp/scan/cover_res.json 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/scan/repos.json data/repos.json && rm -rf thumbs/repos && cp -r /tmp/scan/thumbs_repos thumbs/repos
            cp /tmp/scan/cover_res.json data/cover_res.json 2>/dev/null || true
            python scripts/rekey.py
            python scripts/hub_secure.py
            python scripts/build_portfolio.py
            python scripts/build_updates.py
            python scripts/build_ontology.py
            python scripts/build_i18n_status.py
            python scripts/build_growth.py
            python scripts/build_growth_crime.py
            python scripts/pixel_check.py || python scripts/pixel_check.py --lock-only
            if [ -e data/hub.csv ] || [ -e data/hub.json ] || [ -e data/pixel_audit.json ]; then
              if [ -n "$HUB_KEY" ]; then echo "평문 관리 데이터가 남아 있습니다"; exit 1; fi
            fi
            git add -A data/ thumbs/
            git diff --cached --quiet && { echo "받은 최신에 이미 다 들어 있음"; exit 0; }
            git commit -q -m "표지 현황 자동 수집 $(TZ=Asia/Seoul date +%F)"
            sleep $((i * 5))
          done
          exit 1

      - name: 온톨로지 피드·캐릭터 갤러리에 바로 알리기
        # 관리실 저장(또는 예약 수집)이 끝나면 두 저장소를 바로 다시 만들게 부른다.
        # 토큰: Secrets의 DISPATCH_TOKEN, 없으면 관리실에 등록한 토큰(관리자 비밀번호로 잠김).
        # 토큰에 권한이 없어도 두 저장소가 15분마다 이 저장소의 새 커밋을 확인해 스스로 반영한다.
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          HUB_KEY: ${{ secrets.ADMIN_PASSWORD || secrets.HUB_KEY }}
        run: python scripts/notify_downstream.py
