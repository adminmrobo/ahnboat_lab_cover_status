<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reon Ahn's Lab Server</title>
<meta name="description" content="안상선의 해설 시리즈와 연구 실적을 분야별로 둘러보는 목록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1f2224; --muted:#5f6663; --rule:#dcd8cf; --blue:#2f5f9e; --shadow:0 1px 0 rgba(0,0,0,.04);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1b211e; --ink:#e8ece9; --muted:#9aa5a0; --rule:#2e3833; --blue:#8fb8ff; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614; --panel:#1b211e; --ink:#e8ece9; --muted:#9aa5a0; --rule:#2e3833; --blue:#8fb8ff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;margin:0;overflow-x:hidden;word-break:keep-all}
a{color:var(--blue)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.embed .wrap{max-width:1760px}
header.site{padding-block:28px 6px}
.home header.site{display:none}
.home nav.crumb{display:none}
.home main{padding-top:16px}
.embed header.site{display:none}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
h1{margin:0;font-size:clamp(26px,4.4vw,38px);line-height:1.15}
.lede{margin:8px 0 0;color:var(--muted);max-width:60ch}
nav.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:18px 10px;font-size:14px}
nav.crumb a,nav.crumb span{text-decoration:none;color:var(--muted)}
nav.crumb a:hover{color:var(--ink)}
nav.crumb b{color:var(--ink)}
nav.crumb .sep{color:var(--rule)}
.back{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:99px;padding:4px 12px;cursor:pointer;margin-right:6px}
.step{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 10px}
main{padding-block:0 48px;min-height:40vh}
h2.sec{margin:0 0 4px;font-size:clamp(20px,3vw,26px)}
.secdesc{margin:0 0 16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 14px;cursor:pointer;box-shadow:var(--shadow);text-decoration:none;min-width:0;transition:transform .12s,border-color .12s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--c,var(--ink))}
.tile:focus-visible{outline:2px solid var(--c,var(--blue));outline-offset:2px}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.rack{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--c)}
.tile h3{margin:0;font-size:18px;line-height:1.3}
.tile p{margin:0;color:var(--muted);font-size:13.5px}
.tile .n{margin-top:auto;font-size:13px;color:var(--ink)}
.tile .n b{font-family:var(--mono);font-size:15px}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.subs span{font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:14px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.thumb{aspect-ratio:16/9;background:var(--c);display:block;position:relative;overflow:hidden}
.card.ext .thumb{aspect-ratio:16/5}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;padding:12px;text-align:center;line-height:1.25;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 8px,transparent 8px 16px)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{margin:0;font-size:16px;line-height:1.35}
.cbody p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
.meta span{font-family:var(--mono);border:1px solid var(--rule);border-radius:6px;padding:0 6px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:13.5px;font-weight:700;text-decoration:none;border-radius:8px;padding:6px 12px;border:1px solid var(--c);background:var(--c);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.soon{font-size:12.5px;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:5px 10px}
.err{color:#b3402a}
footer{color:var(--muted);font-size:12.5px;padding-block:0 32px}
.hero{position:relative;border-radius:16px;overflow:hidden;margin:0 0 22px;min-height:260px;display:flex;align-items:flex-end;background:#14181c;color:#fff}
.hbg{position:absolute;inset:0;display:flex}
.hbg i{flex:1;opacity:.92;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 3px,transparent 3px 14px)}
.hbg img{width:100%;height:100%;object-fit:cover;object-position:center 72%;image-rendering:pixelated}
.hbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,16,0) 20%,rgba(10,12,16,.82) 100%)}
.htext{position:relative;padding:22px 24px;max-width:70ch}
.hk{margin:0 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;opacity:.85}
.hero h2{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.15}
.hd{margin:8px 0 0;font-size:14.5px;opacity:.92}
.hs{margin:10px 0 0;font-size:13.5px;opacity:.9}
.hs b{font-family:var(--mono);font-size:16px}
@media (max-width:560px){.hero{min-height:220px}.htext{padding:16px}}
.embed .hero{margin-top:4px}
.hero.light{background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,#fbfaf7;color:#1f2224;border:2px solid #1f2224;box-shadow:5px 5px 0 #1f2224;align-items:stretch;justify-content:space-between;min-height:220px}
.hero.light .htext{align-self:center}
.hero.light .hk{display:inline-block;border:1.5px solid #1f2224;border-radius:99px;padding:2px 10px;background:#fff;opacity:1}
.hero.light .hd,.hero.light .hs{opacity:1;color:#4a5150}
.hsprites{position:relative;display:flex;align-items:flex-end;gap:4px;padding:14px 26px 12px 0;flex:none}
.hsprites img{height:170px;width:auto;image-rendering:pixelated;display:block}
@media (max-width:640px){.hero.light{flex-direction:column}.hsprites{padding:0 16px 12px;justify-content:center;zoom:.7}}
/* 홈페이지에 끼워 넣을 때 글자를 조금 크게 */
.embed body{font-size:16.5px}
.embed .tile p,.embed .cbody p{font-size:14.5px}
.embed .tile h3{font-size:19px}
.embed .tile.big .tbody .kw{font-size:13.5px}
.embed .cbody h3{font-size:17px}
.embed .step,.embed nav.crumb{font-size:14.5px}
.lightview body{background:#fff}
.lightview .tile,.lightview .card{border:2px solid #1f2224;box-shadow:4px 4px 0 #1f2224}
.lightview .tile:hover,.lightview .tile:focus-visible{border-color:#1f2224;transform:translate(-1px,-2px);box-shadow:5px 6px 0 #1f2224}
.lightview .tile.big .pic{border-bottom:2px solid #1f2224}
.lightview .back,.lightview .jump a{border:1.5px solid #1f2224}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile.big{padding:0;overflow:hidden;gap:0}
.tile.big::before{display:none}
.tile.big .pic{position:relative;display:block;aspect-ratio:16/9;background:var(--c);overflow:hidden;border-bottom:3px solid var(--c)}
.tile.big .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.tile.big .pic .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;padding:12px;text-align:center;line-height:1.25;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 8px,transparent 8px 16px)}
.tile.big .tbody{display:flex;flex-direction:column;gap:7px;padding:12px 15px 14px;flex:1}
.kw{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--c)}
.kw span{font-weight:500}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.jump a{font-size:13px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:99px;padding:4px 12px}
.subsec{margin:0 0 26px;scroll-margin-top:12px}
.subh{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:17px;padding-left:10px;border-left:4px solid var(--c)}
.subh small{font-size:12.5px;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<header class="site wrap">
  <p class="kicker">AHNBOAT LAB · 10 RACKS</p>
  <h1>Reon Ahn's Lab Server</h1>
  <p class="lede">박사·조수·초파리 연구원·주판봇이 진행하는 해설 시리즈와 연구 실적을 분야별로 모았습니다. 분야와 중분류를 고르면 주제별 콘텐츠가 바로 나옵니다.</p>
</header>
<nav class="crumb wrap" id="crumb" aria-label="현재 위치"></nav>
<main class="wrap" id="main" aria-live="polite"></main>
<footer class="wrap" id="foot"></footer>

<script>
(function(){
  'use strict';
  var Q=new URLSearchParams(location.search);
  var EMBED=Q.get('embed')==='1';
  if(EMBED)document.documentElement.classList.add('embed');
  if(Q.get('theme')==='light'||Q.get('theme')==='dark')document.documentElement.setAttribute('data-theme',Q.get('theme'));
  var LANG_SHORT={ko:'한국어',en:'English',zh:'中文',ja:'日本語',uz:'Oʻzbekcha',ru:'Русский',vi:'Tiếng Việt'};
  var D=null,CATS=[],ITEMS=[],MIDS=[],FIRST=true;
  /* 화면 종류: server(기본, Lab Server) · articles(논문·발표) · portfolio(포트폴리오). 설정은 data/views.json */
  var VIEW=Q.get('view')||'server',VC={},SINGLE='',ALIAS={};
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
  function rackNo(c){return 'RACK '+String(c.rack).padStart(2,'0');}
  function label(c){return c.label||(c.rack?rackNo(c):'');}
  function enc(s){return encodeURIComponent(s);}
  function H(a){var p=[];for(var k=0;k<a.length&&a[k];k++)p.push(enc(a[k]));if(SINGLE)p=p.slice(1);return '#/'+p.join('/');}
  function onlyMid(cat){var ms=midsOf(cat);return ms.length===1?ms[0]:'';}
  function midName(n){return ALIAS[n]||n;}
  function parse(){var p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);if(SINGLE)p.unshift(SINGLE);return {cat:p[0]||'',mid:p[1]||''};}
  function inCat(n){return ITEMS.filter(function(i){return i.cat===n;});}
  function M(i){return i.mid||'기타';}
  function S(i){return i.sub||'기타';}
  function uniq(list,f){var o=[];list.forEach(function(i){var v=f(i);if(o.indexOf(v)<0)o.push(v);});return o;}
  function midInfo(cat,name){var o=MIDS.filter(function(x){return x.cat===cat&&x.name===name;})[0]||{name:name,keywords:[]};var v=(VC.mid_info||{})[name];return v?Object.assign({},o,v):o;}
  function midsOf(n){
    var have=uniq(inCat(n),M);
    var ord=MIDS.filter(function(x){return x.cat===n;}).map(function(x){return x.name;});
    return have.sort(function(a,b){var ia=ord.indexOf(a),ib=ord.indexOf(b);if(a==='외부_콘텐츠')ia=999;if(b==='외부_콘텐츠')ib=999;return (ia<0?500:ia)-(ib<0?500:ib);});
  }
  function inMid(n,m){return inCat(n).filter(function(i){return M(i)===m;});}
  function subsOf(n,m){return uniq(inMid(n,m),S);}

  function crumb(st){
    var nav=document.getElementById('crumb');nav.textContent='';
    var path=[st.cat,st.mid].filter(Boolean);
    if(SINGLE)path=path.slice(1);
    else if(path.length===2&&onlyMid(st.cat))path=path.slice(0,1);  /* 중분류가 하나뿐이면 분야 단계로 묶음 */
    var full=SINGLE?[SINGLE].concat(path):[st.cat,st.mid].filter(Boolean);
    var rootLabel=(VC.root_label)||'전체 분야';
    if(path.length){var b=el('button','back','← 뒤로');b.type='button';b.addEventListener('click',function(){
      var up=full.slice(0,-1);if(!SINGLE&&up.length===1&&onlyMid(up[0]))up=[];location.hash=H(up);});nav.appendChild(b);}
    function link(txt,a){var x=el('a','',txt);x.href=H(a);return x;}
    nav.appendChild(path.length?link(rootLabel,SINGLE?[SINGLE]:[]):el('b','',rootLabel));
    path.forEach(function(v,k){nav.appendChild(el('span','sep','›'));var last=k===path.length-1;nav.appendChild(last?el('b','',midName(v)):link(midName(v),SINGLE?[SINGLE,v]:[v]));});
  }
  /* 그림·소개·콘텐츠 수·주요 색인어가 있는 카드 (대분류·중분류 공통) */
  function bigTile(c,o,href,count,label){
    var t=el('a','tile big');t.href=href;t.style.setProperty('--c',c.color);
    var f=el('span','pic');var ph=el('span','ph',midName(o.name));
    if(o.image){var im=el('img');im.alt='';im.loading='lazy';im.src=o.image;im.addEventListener('load',function(){ph.remove();post();});im.addEventListener('error',function(){im.remove();});f.appendChild(im);}
    f.appendChild(ph);t.appendChild(f);
    var b=el('span','tbody');
    b.appendChild(el('span','rack',label));
    b.appendChild(el('h3','',midName(o.name)));
    if(o.desc)b.appendChild(el('p','',o.desc));
    if(o.keywords&&o.keywords.length){var s=el('span','kw');s.setAttribute('aria-label','주요 색인어');o.keywords.forEach(function(x){s.appendChild(el('span','','#'+x.replace(/\s+/g,'')));});b.appendChild(s);}
    var n=el('span','n');n.appendChild(el('b','',String(count)));n.appendChild(document.createTextNode(VC.unit||' 개 콘텐츠'));b.appendChild(n);
    t.appendChild(b);return t;
  }
  function hero(m){
    var h=D.hero||{};var box=el('section','hero'+(h.style==='light'?' light':''));
    if(h.style==='light'){
      var tx=el('div','htext');tx.appendChild(el('p','hk',h.kicker||''));tx.appendChild(el('h2','',h.title||''));if(h.desc)tx.appendChild(el('p','hd',h.desc));
      var st2=el('p','hs');st2.appendChild(el('b','',String(ITEMS.length)));st2.appendChild(document.createTextNode(VC.unit||' 개'));tx.appendChild(st2);
      box.appendChild(tx);var sp=el('div','hsprites');sp.setAttribute('aria-hidden','true');
      (h.sprites||[]).forEach(function(o){var im=el('img');if(typeof o==='string')o={src:o};im.src=o.src;im.alt='';if(o.h)im.style.height=o.h+'px';if(o.mb)im.style.marginBottom=o.mb+'px';im.addEventListener('load',post);sp.appendChild(im);});
      box.appendChild(sp);m.appendChild(box);return;
    }
    var bg=el('div','hbg');bg.setAttribute('aria-hidden','true');
    if(h.image){var im=el('img');im.src=h.image;im.alt='';if(h.pos)im.style.objectPosition=h.pos;im.addEventListener('load',post);bg.appendChild(im);bg.classList.add('has');}
    else{(SINGLE?CATS.filter(function(c){return c.name===SINGLE;}):CATS).forEach(function(c){var r=el('i');r.style.background=c.color;bg.appendChild(r);});}
    box.appendChild(bg);
    var t=el('div','htext');
    t.appendChild(el('p','hk',h.kicker||'AHNBOAT LAB'));
    t.appendChild(el('h2','',h.title||"Reon Ahn's Lab Server"));
    if(h.desc)t.appendChild(el('p','hd',h.desc));
    var st=el('p','hs');st.appendChild(el('b','',String(ITEMS.length)));st.appendChild(document.createTextNode(VC.unit||' 개 콘텐츠'));
    if(!SINGLE){st.appendChild(document.createTextNode(' · '));st.appendChild(el('b','',String(CATS.filter(function(c){return inCat(c.name).length;}).length)));st.appendChild(document.createTextNode(' 개 분야'));}
    else{st.appendChild(document.createTextNode(' · '));st.appendChild(el('b','',String(midsOf(SINGLE).length)));st.appendChild(document.createTextNode(' 개 갈래'));}
    t.appendChild(st);
    box.appendChild(t);m.appendChild(box);
  }
  function step1(m){
    hero(m);
    m.appendChild(el('p','step','1단계 · 분야 고르기'));
    var g=el('div','grid big');
    CATS.forEach(function(c){var its=inCat(c.name);if(!its.length)return;var om=onlyMid(c.name);g.appendChild(bigTile(c,c,H(om?[c.name,om]:[c.name]),its.length,label(c)));});
    m.appendChild(g);
  }
  function step2(m,c){
    if(SINGLE){hero(m);m.appendChild(el('p','step','1단계 · 갈래 고르기'));}
    else{m.appendChild(el('p','step','2단계 · 중분류 고르기'));
    m.appendChild(el('h2','sec',c.name));
    if(c.desc)m.appendChild(el('p','secdesc',c.desc));}
    var g=el('div','grid big');
    midsOf(c.name).forEach(function(md){g.appendChild(bigTile(c,midInfo(c.name,md),H([c.name,md]),inMid(c.name,md).length,SINGLE?(VC.mid_label||''):(label(c)?label(c)+' · ':'')+c.name));});
    m.appendChild(g);
  }
  function card(i,c){
    var k=el('article','card'+(i.kind==='ext'&&!i.thumb?' ext':''));k.style.setProperty('--c',c.color);
    var th=el(i.site_url?'a':'div','thumb');if(i.site_url){th.href=i.site_url;th.target='_blank';th.rel='noopener';th.setAttribute('aria-label',i.title+' 열기');}
    if(i.thumb){var im=el('img');im.src=i.thumb;im.alt='';im.loading='lazy';im.addEventListener('load',post);im.addEventListener('error',function(){im.remove();th.appendChild(el('span','ph',S(i)));});th.appendChild(im);}
    else th.appendChild(el('span','ph',S(i)));
    k.appendChild(th);
    var b=el('div','cbody');
    b.appendChild(el('h3','',i.title));
    if(i.summary)b.appendChild(el('p','',i.summary));
    var meta=el('div','meta');
    if(i.langs&&i.langs.length>1)meta.appendChild(el('span','',i.langs.length+'개 언어'));
    if(i.kind==='ext'&&i.link){var nt=i.link.replace(/\s*·?\s*https?:\/\/\S+/,'').trim();if(nt)meta.appendChild(el('span','',nt));}
    if(i.note)meta.appendChild(el('span','',i.note));
    if(meta.childNodes.length)b.appendChild(meta);
    var acts=el('div','acts');
    if(i.site_url){var o=el('a','btn',i.button||(i.kind==='ext'?'자세히 보기':'콘텐츠 열기'));o.href=i.site_url;o.target='_blank';o.rel='noopener';acts.appendChild(o);}
    else if(i.kind==='portfolio')acts.appendChild(el('span','soon','링크 준비 중'));
    if(i.repo_url){var g=el('a','btn ghost','GitHub');g.href=i.repo_url;g.target='_blank';g.rel='noopener';acts.appendChild(g);}
    if(i.kind==='repo'&&i.link){var u=(i.link.match(/https?:\/\/\S+/)||[])[0];if(u){var p=el('a','btn ghost','논문 원문');p.href=u;p.target='_blank';p.rel='noopener';acts.appendChild(p);}}
    if(acts.childNodes.length)b.appendChild(acts);
    k.appendChild(b);return k;
  }
  /* 3단계: 중분류 안의 소분류를 묶음 제목으로, 항목을 바로 보여 준다 */
  function step3(m,c,md){
    var info=midInfo(c.name,md);
    m.appendChild(el('p','step',(SINGLE?'2단계':'마지막 단계')+' · 콘텐츠 열기'));
    m.appendChild(el('h2','sec',midName(md)));
    m.appendChild(el('p','secdesc',(SINGLE?'':c.name+(info.desc?' · ':''))+(info.desc||'')));
    var subs=subsOf(c.name,md);
    if(subs.length===1&&subs[0]==='기타'){var g0=el('div','cards');inMid(c.name,md).forEach(function(i){g0.appendChild(card(i,c));});m.appendChild(g0);return;}
    if(subs.length>1){var jump=el('nav','jump');jump.setAttribute('aria-label','소분류');subs.forEach(function(s,k){var a=el('a','',s+' '+inMid(c.name,md).filter(function(i){return S(i)===s;}).length);a.href='#';a.addEventListener('click',function(e){e.preventDefault();var t=document.getElementById('sub'+k);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});});jump.appendChild(a);});m.appendChild(jump);}
    subs.forEach(function(s,k){
      var sec=el('section','subsec');sec.id='sub'+k;sec.style.setProperty('--c',c.color);
      var its=inMid(c.name,md).filter(function(i){return S(i)===s;});
      var h=el('h3','subh',s);h.appendChild(el('small','',its.length+'개'));sec.appendChild(h);
      var g=el('div','cards');its.forEach(function(i){g.appendChild(card(i,c));});sec.appendChild(g);
      m.appendChild(sec);
    });
  }
  function render(){
    if(!D)return;
    var st=parse(),m=document.getElementById('main');m.textContent='';
    var c=CATS.filter(function(x){return x.name===st.cat;})[0];
    if(st.cat&&!c){st={cat:'',mid:''};}
    if(c&&st.mid&&midsOf(c.name).indexOf(st.mid)<0){st.mid='';}
    crumb(st);
    document.documentElement.classList.toggle('home',SINGLE?!st.mid:!c);
    if(!c)step1(m);else if(!st.mid)step2(m,c);else step3(m,c,st.mid);
    if(!EMBED)window.scrollTo(0,0);
    post(FIRST?false:true);FIRST=false;
  }
  function post(nav){if(window.parent!==window){try{var h=Math.ceil(document.body.getBoundingClientRect().height);window.parent.postMessage({type:'ahnboat-catalog-height',height:h,nav:!!nav},'*');}catch(e){}}}
  window.addEventListener('hashchange',render);
  window.addEventListener('resize',post);
  function getJSON(p){return fetch(p,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(p+' '+r.status);return r.json();});}
  getJSON('data/views.json').catch(function(){return {};}).then(function(views){
    VC=views[VIEW]||{};
    return getJSON(VC.source||'data/catalog.json');
  }).then(function(d){
    D=d;CATS=d.categories||[];MIDS=d.mids||[];ALIAS=VC.mid_alias||{};
    if(VC.only){SINGLE=VC.only;CATS=CATS.filter(function(c){return c.name===SINGLE;});}
    if(VC.hero)D.hero=VC.hero;
    if(VC.hero&&VC.hero.style==='light')document.documentElement.classList.add('lightview');
    if(VC.page_title)document.title=VC.page_title;
    ITEMS=(d.items||[]).filter(function(i){return CATS.some(function(c){return c.name===i.cat;});});
    document.getElementById('foot').textContent=(VC.foot||('콘텐츠 '+ITEMS.length+'개 · 랩타운 지하 1층 서버실의 랙과 같은 분류입니다.'))+' · 갱신 '+d.updated;
    render();
    document.querySelectorAll('img').forEach(function(im){im.addEventListener('load',post);});
  }).catch(function(e){document.getElementById('main').appendChild(el('p','err','목록을 읽지 못했습니다 ('+e.message+').'));});
})();
</script>
</body>
</html>
