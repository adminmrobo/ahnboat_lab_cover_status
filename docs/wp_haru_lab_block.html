<!-- ahnboat.xyz 홈 '조수 하루의 3차원 실험실' 블록 (2026-11-26 v2)
     워드프레스 홈 편집 화면에서 'SERIES · 대표 시리즈' 상자 바로 위에 '사용자 정의 HTML' 블록을 하나 만들고
     이 코드를 그대로 붙인다. (v1을 '지식 노드 현황' 위에 붙여 두었다면 그 블록은 지운다.)
     - 바로가기 주소: ahnboat.xyz/#haru-lab
     - 회차 추가: 이 코드는 그대로 두고 저장소 data/haru_lab.json의 episodes에 한 줄 더한다. -->
<div id="haru-lab" style="scroll-margin-top:80px">
  <iframe src="https://adminmrobo.github.io/ahnboat_lab_cover_status/haru_lab.html?embed=1&amp;theme=light"
          title="조수 하루의 3차원 실험실" loading="lazy"
          style="display:block;width:100%;height:300px;border:0;overflow:hidden"></iframe>
</div>
<script>
(function(){
  var box=document.getElementById('haru-lab'),f=box&&box.querySelector('iframe');if(!f)return;
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||d.type!=='ahnboat-catalog-height'||e.source!==f.contentWindow)return;
    var h=Math.max(200,Math.min(4000,Number(d.height)||0));if(h)f.style.height=h+'px';
  });
  if(location.hash==='#haru-lab')setTimeout(function(){box.scrollIntoView({behavior:'smooth'});},600);
})();
</script>
