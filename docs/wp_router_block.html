<!-- ahnboat.xyz 공유 주소 라우터 v3 (2026-11-28) — v2에서 바뀐 점: 조수 하루의 3차원 실험실 회차 주소 #/haru3d/<저장소> — 회차 카드를 누르면 홈 안의 전체 화면 창에서 열리고 주소가 ahnboat.xyz/#/haru3d/Tokenization-BPE-tutorial 처럼 바뀐다. 그 주소로 들어오면 바로 그 회차가 열린다. 닫기·Esc·뒤로 가기로 홈에 돌아온다. #/haru3d 만 있으면 실험실 막대로 스크롤.
     v2(2026-11-26) — v1에서 바뀐 점: 특별 카드(도감·입문) 주소 #/lab-server/special/<이름>으로 들어오면 그 카드 자리까지 스크롤
     워드프레스 홈 화면 맨 끝에 '사용자 정의 HTML' 블록을 하나 더 만들고 이 코드를 그대로 붙인다. 화면에는 아무것도 보이지 않는다.
     하는 일
       1) Lab Server·Articles·Portfolio 화면(catalog.html iframe)에서 랙·갈래를 누르면 주소창이
          ahnboat.xyz/#/lab-server/rack01/concept-map 처럼 바뀐다(뒤로 가기 기록은 늘리지 않음).
       2) 그 주소로 들어오면 해당 iframe을 그 위치로 열고 그 블록까지 스크롤한다.
       3) #/lab-server/special/neural-networks 처럼 도감·입문 카드 주소로 들어오면 그 카드까지 스크롤하고 카드가 반짝인다.
       4) #/schedule · #/top · #/haru3d 는 그 블록으로 스크롤만 한다.
       5) #/haru3d/<저장소> 는 하루의 실험실 그 회차를 홈 안의 전체 화면 창으로 연다(v3).
     MODE='path' 는 서버에 주소 규칙(docs/wp_path_rewrite.php)을 넣은 뒤에만 켠다 → ahnboat.xyz/lab-server/rack01 -->
<script>
(function(){
  'use strict';
  var MODE='hash';                       /* 'hash' = ahnboat.xyz/#/lab-server/rack01 · 'path' = ahnboat.xyz/lab-server/rack01 */
  var SECTIONS={schedule:'schedule.html',top:'top.html',haru3d:'haru_lab.html'};   /* 스크롤만 하는 블록: 이름 → iframe 주소에 든 파일 이름 */
  var BASE_TITLE=document.title,LANDING=read(),DONE={},OFF=0,TARGET=null;

  function read(){
    var p=MODE==='path'?location.pathname:(location.hash.indexOf('#/')===0?location.hash.slice(2):'');
    try{p=decodeURIComponent(p);}catch(e){}
    return p.replace(/^\/+|\/+$/g,'');
  }
  function write(path){
    var url=MODE==='path'?'/'+path+location.search:location.pathname+location.search+'#/'+path;
    if(url!==location.pathname+location.search+location.hash){try{history.replaceState(history.state,'',url);}catch(e){}}
  }
  function frames(){return Array.prototype.slice.call(document.querySelectorAll('iframe'));}
  function frameOf(win){return frames().filter(function(f){return f.contentWindow===win;})[0];}
  function show(f){if(!f)return;TARGET=f;[200,900,2000].forEach(function(t){setTimeout(go,t);});}
  function go(){if(!TARGET)return;var y=TARGET.getBoundingClientRect().top+window.scrollY+(OFF?OFF-90:0);window.scrollTo({top:Math.max(0,y),behavior:'smooth'});}

  window.addEventListener('message',function(e){
    var d=e.data;if(!d||typeof d!=='object')return;
    if(d.type==='ahnboat-route-ready'){try{e.source.postMessage({type:'ahnboat-router-hello',v:3},'*');}catch(_){}}
    if(d.type==='ahnboat-haru-open'&&typeof d.key==='string'){haruOpen(d.key,d.url,d.title,true);return;}
    if(d.type==='ahnboat-route-ready'&&LANDING&&d.prefix!=='haru3d'){
      var first=LANDING.split('/')[0].toLowerCase();
      if(first===String(d.prefix).toLowerCase()&&!DONE[d.prefix]){DONE[d.prefix]=1;
        try{e.source.postMessage({type:'ahnboat-route-set',path:LANDING},'*');}catch(_){}
        show(frameOf(e.source));}
    }
    if(d.type==='ahnboat-route'&&d.nav&&typeof d.path==='string'){
      write(d.path);
      if(d.land&&typeof d.y==='number'){OFF=d.y;TARGET=frameOf(e.source)||TARGET;go();}
      document.title=d.title?d.title+' · '+BASE_TITLE:BASE_TITLE;
    }
  });

  /* ---------- 하루의 실험실 회차 창 (#/haru3d/<저장소>) ---------- */
  var HARU_JSON='https://adminmrobo.github.io/ahnboat_lab_cover_status/data/haru_lab.json',HV=null;
  function haruUI(){if(HV)return HV;
    var st=document.createElement('style');st.textContent='#ahn-haru{position:fixed;inset:0;z-index:99999;background:#fff;display:none;flex-direction:column}#ahn-haru.on{display:flex}#ahn-haru .hb{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid #1f2224;background:#fbfaf7;font:600 14px/1.3 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1f2224}#ahn-haru .hb b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#ahn-haru .hb a,#ahn-haru .hb button{font:inherit;font-size:13px;color:#1f2224;background:#fff;border:1.5px solid #1f2224;border-radius:99px;padding:4px 12px;text-decoration:none;cursor:pointer;box-shadow:2px 2px 0 #1f2224;white-space:nowrap}#ahn-haru iframe{flex:1;width:100%;border:0;background:#fff}html.ahn-haru-lock,html.ahn-haru-lock body{overflow:hidden!important}';
    document.head.appendChild(st);
    var w=document.createElement('div');w.id='ahn-haru';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
    w.innerHTML='<div class="hb"><span aria-hidden="true">🧪</span><b></b><a target="_blank" rel="noopener">새 탭 ↗</a><button type="button" aria-label="닫기">닫기 ✕</button></div><iframe allow="autoplay; fullscreen" title=""></iframe>';
    document.body.appendChild(w);
    w.querySelector('button').addEventListener('click',function(){haruClose(true);});
    document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&w.classList.contains('on'))haruClose(true);});
    HV={w:w,t:w.querySelector('b'),a:w.querySelector('a'),f:w.querySelector('iframe'),key:''};return HV;}
  function haruOpen(key,url,title,push){var v=haruUI();
    if(!url){url='https://adminmrobo.github.io/'+key+'/';}
    if(v.key!==key){v.f.src=url;v.key=key;}
    v.t.textContent=title||key;v.a.href=url;v.f.title=title||key;
    v.w.classList.add('on');document.documentElement.classList.add('ahn-haru-lock');try{v.w.querySelector('button').focus({preventScroll:true});}catch(_){}
    var u=location.pathname+location.search+'#/haru3d/'+key;
    if(push&&location.hash!=='#/haru3d/'+key){try{history.pushState({ahnHaru:key},'',u);}catch(_){}}else write('haru3d/'+key);
    document.title=(title||key)+' · '+BASE_TITLE;}
  function haruClose(back){if(!HV)return;HV.w.classList.remove('on');document.documentElement.classList.remove('ahn-haru-lock');document.title=BASE_TITLE;
    if(back&&history.state&&history.state.ahnHaru){history.back();return;}
    if(/^#\/haru3d\//.test(location.hash))write('haru3d');}
  window.addEventListener('popstate',function(){var p=read();
    if(p.indexOf('haru3d/')===0)haruLand(p.split('/')[1]);else if(HV&&HV.w.classList.contains('on')){HV.w.classList.remove('on');document.documentElement.classList.remove('ahn-haru-lock');document.title=BASE_TITLE;}});
  function haruLand(key){
    fetch(HARU_JSON,{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
      var e=(d.episodes||[]).filter(function(x){return x.url&&x.url.indexOf('/'+key+'/')>=0;})[0];
      haruOpen(key,e?e.url:null,e?e.ep+' '+e.title:key,false);}).catch(function(){haruOpen(key,null,key,false);});}
  if(LANDING.indexOf('haru3d/')===0&&LANDING.split('/')[1]){var hk=LANDING.split('/')[1];if(document.body)haruLand(hk);else document.addEventListener('DOMContentLoaded',function(){haruLand(hk);});}
  /* 이미 떠 있는 화면들에 라우터가 있음을 알린다 */
  window.addEventListener('load',function(){frames().forEach(function(f){try{f.contentWindow.postMessage({type:'ahnboat-router-hello',v:3},'*');}catch(_){}});});

  /* #/schedule 처럼 스크롤만 하는 블록 */
  var first=LANDING.split('/')[0];
  if(SECTIONS[first]&&!(first==='haru3d'&&LANDING.split('/')[1])){
    var goSec=function(){show(frames().filter(function(f){return (f.getAttribute('src')||'').indexOf(SECTIONS[first])>=0;})[0]);};
    if(document.readyState==="complete")goSec();else window.addEventListener("load",goSec);
  }
})();
</script>
