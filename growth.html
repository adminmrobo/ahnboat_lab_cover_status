   흰 툰 홈페이지 안에 검은 연구실 모니터 두 대(전체 · 이번 주)와 조수 하루의 읽기 카드.
   데이터: data/growth.json (scripts/build_growth.py가 하루 두 번 만든다) · 언어: i18n.js */
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --line:#1f2224;
  --violet:#6b4fd6; --acc:#f4c06a; --scr:#000; --scr-ink:#f2f2f2; --scr-mute:#8d8d93; --scr-line:#26262b;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
:root[data-theme="dark"]{--bg:#121614;--paper:#1b211e;--ink:#e8ece9;--muted:#9aa5a0;--line:#e8ece9;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;overflow-x:hidden;word-break:keep-all}
.wrap{max-width:1160px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px}
.embed .wrap{max-width:1760px}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:0 0 10px}
.kicker{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg)}
h1{margin:0;font-size:clamp(28px,3.2vw,38px);line-height:1.15}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.headrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin:0 0 10px}.headrow .head{margin:0}
.more{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border:2px solid var(--line);border-radius:99px;box-shadow:3px 3px 0 var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.more:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}.more:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.mons{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:stretch}
.mon{position:relative;display:flex;flex-direction:column;background:var(--scr);color:var(--scr-ink);border:2px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);overflow:hidden}
.mon .tag{position:absolute;right:14px;top:12px;z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--scr-mute);border:1px solid #3a3a40;border-radius:99px;padding:2px 9px;background:rgba(0,0,0,.6)}
.fig{position:relative;flex:1;min-height:300px}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#m1 .fig{min-height:clamp(380px,31vw,540px)}
.hud{position:absolute;left:22px;top:20px;width:220px;z-index:2;pointer-events:none}
.big{font:300 clamp(46px,4.6vw,76px)/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:16px;margin-top:6px}
.sm{color:var(--scr-mute);font-size:13.5px;line-height:1.45;margin-top:3px;font-variant-numeric:tabular-nums}
.hud h3{font-weight:400;font-size:14px;margin:20px 0 6px}
canvas.mini{width:100%;height:120px;display:block}
.now{margin-top:12px;font-size:12.5px;color:var(--scr-mute);line-height:1.4;min-height:3em}
.now b{display:block;color:var(--scr-ink);font-weight:400}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12.5px;color:var(--scr-mute);z-index:2;pointer-events:none;opacity:0;transition:opacity .4s}
.hint.on{opacity:1}
#m1.stack .hud{position:relative;left:0;top:0;width:auto;padding:18px 18px 0}
#m1.stack .hud h3,#m1.stack canvas.mini{display:none}
.top2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 22px;align-items:end;padding:18px 18px 4px;position:relative;z-index:2}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;align-items:end;height:84px;max-width:330px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;font-size:12px;color:var(--scr-mute)}
.bars i{display:block;width:100%;background:#3a3a40;border-radius:2px 2px 0 0;min-height:2px;transition:background .2s}
.bars .on i{background:var(--acc)}.bars .on{color:var(--scr-ink)}
.bars s{text-decoration:none;font-size:11.5px;color:var(--scr-ink);margin-bottom:2px;font-variant-numeric:tabular-nums}
.top2 .sm{grid-column:1/-1}
#m2 .tag,#m3 .tag{top:auto;bottom:12px}
#m3{display:none}.full #m3{display:flex}
.full #m1{grid-column:1/-1}.full .mons{grid-template-columns:repeat(2,minmax(0,1fr))}.full #m1 .fig{min-height:clamp(420px,44vw,700px)}.full #m2 .fig,.full #m3 .fig{min-height:clamp(340px,30vw,520px)}
.legend{list-style:none;margin:0;padding:0;columns:2;column-gap:18px;font-size:12.5px;line-height:1.75}.legend li{display:flex;gap:7px;align-items:center;break-inside:avoid}.legend span{flex:1;color:#cfcfd4}.legend em{font-style:normal;color:var(--scr-mute);font-variant-numeric:tabular-nums}.legend i{width:9px;height:9px;border-radius:50%;flex:none}
#m3.narrow .top2{grid-template-columns:minmax(0,1fr)}
#m3.narrow .legend{columns:1}
.full .wrap{max-width:1500px}
html:lang(ja) body,html:lang(zh-CN) body{word-break:normal;overflow-wrap:anywhere}
@media (max-width:899px){.full .mons{grid-template-columns:minmax(0,1fr)}}
#m2.narrow .top2{grid-template-columns:minmax(0,1fr)}#m2.narrow .bars{max-width:none}
.empty{position:absolute;inset:auto 0 45% 0;text-align:center;color:var(--scr-ink);font-size:15px;z-index:2;display:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--scr-line)}
.ctrl button{background:#111114;color:var(--scr-ink);border:1px solid #34343a;border-radius:10px;min-height:44px;padding:0 16px;font:inherit;font-size:14.5px;cursor:pointer}
.ctrl button:focus-visible,.ctrl input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ctrl input[type=range]{flex:1;min-width:140px;accent-color:var(--acc);height:44px}
.ctrl output{font-size:13px;color:var(--scr-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tip{position:absolute;z-index:4;pointer-events:none;background:rgba(14,14,18,.95);border:1px solid #3a3a42;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:270px;display:none;color:var(--scr-ink)}
.tip b{font-size:14.5px}.tip span{color:var(--scr-mute)}
.haru{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;align-items:start;margin:0 0 22px;padding:16px 20px;background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line)}
.haru img{width:112px;height:112px;border-radius:50%;border:2px solid var(--line);background:#fff;object-fit:cover;image-rendering:pixelated}
.haru .who{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--violet);font-weight:700}
.haru h2{margin:2px 0 8px;font-size:20px;line-height:1.25}
.haru ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.haru li{position:relative;padding-left:16px;font-size:15px}
.haru li::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--violet)}
.haru li b{font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 1px;vertical-align:0}
.foot{margin:16px 0 0;font-size:12.5px;color:var(--muted)}
@media (max-width:899px){.mons{grid-template-columns:minmax(0,1fr)}#m2 .fig{min-height:320px}}
@media (max-width:560px){.haru{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px}.haru img{width:72px;height:72px}.top2{grid-template-columns:minmax(0,1fr)}.big{font-size:44px}}
</style>

  var nbr=[];for(i=0;i<N;i++)nbr.push([]);E.forEach(function(e){nbr[e[0]].push(e[1]);nbr[e[1]].push(e[0]);});
  /* 분야 이름 자리: 분야 덩어리의 바깥쪽 가장자리 (가운데 분야는 덩어리 한가운데) */

  var dayOf=function(iso){return (new Date(iso+'T00:00:00+09:00').getTime()-t0.getTime())/864e5;};

  /* ---------- 창 1: 처음 → 현재, 끝나면 현재 모습에 머문다 */
  var v1=View($('m1'),$('c1')),v2=View($('m2'),$('c2')),v3=View($('m3'),$('c3'));v2.small=true;var views=FULLV?[v1,v2,v3]:[v1,v2];

    tip.style.display='block';tip.style.left=Math.min(e.clientX-r.left+14,r.width-280)+'px';tip.style.top=Math.min(e.clientY-r.top+14,r.height-120)+'px';});

    if(on(v1)&&v1.W&&(playing||v1.dirty||!v1.cam||v1.moving)){
      var bb=done()?FULL:bbox(function(q){return TD[q]<=T1;});var pc=v1.cam&&v1.cam.s;v1.fit(bb,false);v1.moving=pc&&Math.abs(v1.cam.s-pc)>pc*1e-4;
      var cc=counter(T1);draw(v1,{T:T1,count:cc[1],first:true,still:done(),focus:focus,near:near});v1.dirty=false;
      if(cc[0]!==lastN1){lastN1=cc[0];$('n1').textContent=fmt(cc[0]);mini(T1);
        $('d1').innerHTML=esc(kdate(dateAt(Math.min(T1,TEND-.05))))+'<br>'+L('rel',fmt(edgesAt(T1)),fmt(pagesAt(T1)));}
      var lp=lastPage(T1);if(lp!==lastP1){lastP1=lp;$('now1').innerHTML=lp?L('latest')+'<b>'+esc(lp.title)+'</b>':'';}
      $('scrub').value=Math.round(1000*T1/TEND);$('o1').textContent=kdate(dateAt(Math.min(T1,TEND-.05)));}
    if(!REDUCE&&W.nodes){if(T2<WSTOP)T2=Math.min(WSTOP,T2+dt*(WSTOP-WS)/8);else if((hold2+=dt)>2.5){T2=WS;hold2=0;}}else T2=WSTOP;
    if(on(v2)&&v2.W){v2.fit(FULL,true);draw(v2,{T:Math.min(T2,TEND),week:true,count:ALL[1],still:!W.nodes});
      var n2=0;for(var q=0;q<N;q++)if(T[q]>=WS&&TD[q]<=T2)n2++;if(n2!==lastN2){lastN2=n2;$('n2').textContent='+'+fmt(n2);}
      var d=Math.min(lastDay,bucketAt(T2));if(d!==lastBar){lastBar=d;document.querySelectorAll('#bars div').forEach(function(el){el.classList.toggle('on',+el.dataset.d<=d);});}}
    if(FULLV&&on(v3)&&v3.W&&v3.dirty){v3.dirty=false;v3.fit(FULL,true);draw(v3,{T:TEND,count:ALL[1],still:true,focus:f3,near:near3});}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
})();
