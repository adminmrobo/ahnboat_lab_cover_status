<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조수 하루의 3차원 실험실 · Reon Ahn's Lab</title>
<meta name="description" content="좌표로 이루어진 방에서 실험조수 하루가 실험을 다시 돌려 숫자와 그림으로 보여 주는 연재">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 홈페이지 블록 '조수 하루의 3차원 실험실' — SERIES(대표 시리즈) 바로 위의 가로로 긴 막대.
   주인장은 누구?·SERIES 상자와 같은 흰 툰(크림 바탕 · 검은 외곽선 · 딱딱한 그림자).
   회차 카드 5장: data/haru_lab.json (status open = 공개, soon = 준비 중). 방 = 랩타운 2층 haru3d.html.
   끼워 넣기: haru_lab.html?embed=1&theme=light · 붙이는 코드: docs/wp_haru_lab_block.html */
:root{--bg:#ffffff;--paper:#fbfaf7;--ink:#1f2224;--muted:#5f6663;--line:#1f2224;--violet:#6b4fd6;--gold:#e0a92a;--plain:#e4572e;--drop:#1f8fd6;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
:root[data-theme="dark"]{--bg:#121614;--paper:#1b211e;--ink:#e8ece9;--muted:#9aa5a0;--line:#e8ece9;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overflow-x:hidden;word-break:keep-all}
.wrap{max-width:1160px;margin:0 auto;padding:10px max(14px,env(safe-area-inset-left,0px)) 14px}
.embed .wrap{max-width:none;padding:0 6px 7px 0}
.bar{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr);gap:16px;align-items:stretch;background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);padding:16px 22px;
  background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper)}
.lead{display:flex;flex-direction:column;gap:8px;justify-content:center}
.tt{display:flex;align-items:center;gap:10px}
.tt img{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:#dfe3ea;object-fit:cover;flex:none}
.kicker{display:inline-block;font:400 11px var(--mono);letter-spacing:.08em;border:1.5px solid var(--line);border-radius:99px;padding:2px 10px;background:#d9ccff;color:#1f2224}
h2{margin:3px 0 0;font-size:17px;line-height:1.25}
.lead p{margin:0;font-size:13px;color:var(--muted)}
.room{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:40px;padding:0 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:#1f2224;font-weight:700;font-size:13.5px;text-decoration:none;box-shadow:3px 3px 0 var(--line)}
.room:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.room:focus-visible,.ep:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ep{display:flex;flex-direction:column;background:#fff;color:#1f2224;border:2px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);overflow:hidden;text-decoration:none;transition:transform .15s,box-shadow .15s}
a.ep:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}
.ep .shot{position:relative;aspect-ratio:16/10;background:#0b111c;overflow:hidden;border-bottom:2px solid var(--line)}
.ep .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.ep .no{position:absolute;left:6px;top:6px;font:700 10.5px var(--mono);background:#1f2224;color:#f2c744;border-radius:6px;padding:1px 6px}
.ep .bd{padding:7px 9px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
.ep b{font-size:14px;line-height:1.3}
.ep .pos{font:11px var(--mono);color:var(--muted)}
.ep .st{display:flex;gap:8px;font:700 13px var(--mono);margin-top:2px}
.ep .st small{font:400 10.5px var(--font);color:var(--muted);margin-left:2px}
.ep.soon{border-style:dashed;box-shadow:none;background:#f6f6f3;color:var(--muted)}
.ep.soon .shot{background:#eef0f3;background-image:linear-gradient(#d5d9e0 1px,transparent 1px),linear-gradient(90deg,#d5d9e0 1px,transparent 1px);background-size:12px 12px;display:flex;align-items:center;justify-content:center}
.ep.soon .q{font:700 26px var(--mono);color:#9aa1ab;background:#fff;border:2px dashed #9aa1ab;border-radius:10px;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.ep.soon b{color:var(--muted)}
/* 회차가 5개를 넘으면 최신 4개 + '전체 회차 보기' 카드 (전체는 ?all=1) */
.ep.more{background:#d9ccff;justify-content:center;align-items:center;text-align:center;gap:6px;padding:14px 10px}
.ep.more .n{font:700 28px/1 var(--mono)}
.ep.more b{font-size:14px}
.ep.more small{font-size:11.5px;color:#3d3f42}
html.all .cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
@media (max-width:1100px){.bar{grid-template-columns:1fr}.lead{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 14px}.lead p{flex:1 1 260px}}
@media (max-width:760px){html:not(.all) .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.ep{flex:0 0 46%;scroll-snap-align:start}.ep.soon{flex-basis:34%}}
@media (max-width:420px){.ep{flex-basis:64%}.ep.soon{flex-basis:42%}}
@media (prefers-reduced-motion:reduce){a.ep,.room{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="haru-lab">
  <section class="bar" aria-labelledby="title">
    <div class="lead">
      <div class="tt"><img src="thumbs/chars/idphoto/haru_E07.webp" alt="실험조수 하루" width="58" height="58">
        <div><span class="kicker" id="kicker">HARU'S 3D LAB</span><h2 id="title">조수 하루의 3차원 실험실</h2></div></div>
      <p id="intro">좌표로 이루어진 거대한 방에서 실험조수 하루가 실험을 직접 다시 돌리고, 숫자와 그림으로 보여 줍니다.</p>
      <a class="room" id="room" href="https://adminmrobo.github.io/ahn_boat_lab_town/haru3d.html" target="_blank" rel="noopener">🛗 랩타운 2층 실험실 가기</a>
    </div>
    <div class="cards" id="cards" aria-label="회차"></div>
  </section>
</div>
<script src="i18n.js"></script>
<script>
(function(){
  'use strict';
  var Q=new URLSearchParams(location.search);
  if(Q.get('embed')==='1')document.documentElement.classList.add('embed');
  var ALL=Q.get('all')==='1';if(ALL)document.documentElement.classList.add('all');
  if(Q.get('theme')==='dark'||Q.get('theme')==='light')document.documentElement.setAttribute('data-theme',Q.get('theme'));
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
  /* 홈(ahnboat.xyz)의 주소 라우터 v3가 있으면 회차를 홈 안에서 열고 주소를 #/haru3d/<저장소>로 바꾼다. 없으면 새 탭. */
  var ROUTER=false;
  function openIn(ev){if(!ROUTER||ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.button===1)return;var a=ev.currentTarget;if(!a.dataset.key)return;
    ev.preventDefault();try{window.parent.postMessage({type:'ahnboat-haru-open',key:a.dataset.key,url:a.href,title:a.dataset.title},'*');}catch(e){window.open(a.href,'_blank','noopener');}}
  window.addEventListener('message',function(e){var d=e.data;if(d&&d.type==='ahnboat-router-hello'&&e.source===window.parent)ROUTER=true;});
  if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-route-ready',view:'haru3d',prefix:'haru3d'},'*');}catch(e){}}
  function post(){if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-catalog-height',height:Math.ceil(document.body.getBoundingClientRect().height),nav:false},'*');}catch(e){}}}
  var T=function(x){return window.AhnI18n?AhnI18n.t.apply(null,arguments):x;},DATA=null;
  function render(d){
    DATA=d;
    ['kicker','title','intro'].forEach(function(k){var x=document.getElementById(k);if(!x.dataset.ko)x.dataset.ko=d[k]||x.textContent;x.textContent=T(x.dataset.ko);});
    var rm=document.getElementById('room');if(!rm.dataset.ko)rm.dataset.ko=rm.textContent;rm.textContent=T(rm.dataset.ko);
    if(d.room)document.getElementById('room').href=d.room;
    var box=document.getElementById('cards');box.textContent='';
    // 최신 회차가 앞으로. 공개 회차 먼저(최신순), 준비 중은 뒤에.
    var all=(d.episodes||[]).slice().reverse(),eps=all.filter(function(e){return e.status==='open'&&e.url;}).concat(all.filter(function(e){return !(e.status==='open'&&e.url);}));
    var nOpen=eps.filter(function(e){return e.status==='open'&&e.url;}).length,MAX=5;
    if(ALL)eps=(d.episodes||[]).slice();  // 전체 보기는 EP.01부터 차례대로
    var more=!ALL&&eps.length>MAX;
    if(more)eps=eps.slice(0,MAX-1);
    eps.forEach(function(e){
      var open=e.status==='open'&&e.url, c=el(open?'a':'div','ep'+(open?'':' soon'));
      if(open){c.href=e.url;if(window.AhnI18n&&AhnI18n.lang!=='ko'){var m0=/github\.io\/([^\/]+)/.exec(e.url),lk=m0&&AhnI18n.link('https://github.com/adminmrobo/'+m0[1],e.url);if(lk&&lk[1])c.href=lk[0];}c.target='_blank';c.rel='noopener';c.dataset.key=(/github\.io\/([^\/]+)/.exec(e.url)||[])[1]||'';c.dataset.title=T(e.ep)+' '+T(e.title);c.addEventListener('click',openIn);}else c.setAttribute('aria-label',e.ep+' '+T('준비 중'));
      var sh=el('div','shot');
      if(open&&e.thumb){var im=el('img');im.src=e.thumb;im.alt='';im.loading='lazy';im.addEventListener('load',post);sh.appendChild(im);}else sh.appendChild(el('span','q','?'));
      sh.appendChild(el('span','no',e.ep));c.appendChild(sh);
      var bd=el('div','bd');bd.appendChild(el('b',null,open?T(e.title):T('준비 중')));if(open&&e.desc)c.title=T(e.desc);
      if(e.pos)bd.appendChild(el('span','pos',T('실험대')+' '+e.pos));
      if(open&&e.stats){var st=el('div','st');e.stats.forEach(function(s,i){var x=el('span',null,T(s[0]));x.style.color=i?'var(--drop)':'var(--plain)';x.appendChild(el('small',null,T(s[1])));st.appendChild(x);});bd.appendChild(st);}
      c.appendChild(bd);box.appendChild(c);
    });
    if(more){var m=el('a','ep more');m.href=location.pathname.replace(/[^/]*$/,'')+'haru_lab.html?all=1';m.target='_blank';m.rel='noopener';
      m.appendChild(el('span','n',String(all.length)));m.appendChild(el('b',null,T('전체 회차 보기')));m.appendChild(el('small',null,T('공개 {0}편 · EP.01부터 모아 보기',nOpen)));box.appendChild(m);}
    post();
  }
  fetch('data/haru_lab.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){return (window.AhnI18n?AhnI18n.ready:Promise.resolve()).then(function(){render(d);});}).catch(post);
  if(window.AhnI18n)AhnI18n.onChange(function(){if(DATA)render(DATA);});
  window.addEventListener('resize',post);
  if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
  post();
})();
</script>
</body>
</html>
