<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루의 실험실 · Reon Ahn's Lab</title>
<meta name="description" content="실험조수 하루가 AI 실험을 직접 다시 돌려 숫자와 그림으로 설명하는 연재">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 홈페이지 블록 '하루의 실험실' — 'Reon Ahn Page 지식 노드 현황'(growth.html) 바로 위.
   지식 노드 현황과 같은 흰 툰 화면 + 검은 실험 모니터 카드. 회차는 data/haru_lab.json에 한 줄씩 더한다.
   끼워 넣기: haru_lab.html?embed=1&theme=light (높이를 바깥 페이지에 알린다) · 붙이는 코드: docs/wp_haru_lab_block.html */
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --line:#1f2224;
  --violet:#6b4fd6; --acc:#f4c06a; --scr:#000; --scr-ink:#f2f2f2; --scr-mute:#8d8d93; --scr-line:#26262b;
  --plain:#ff6a4d; --drop:#4fb4ff;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
:root[data-theme="dark"]{--bg:#121614;--paper:#1b211e;--ink:#e8ece9;--muted:#9aa5a0;--line:#e8ece9;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;overflow-x:hidden;word-break:keep-all}
.wrap{max-width:1160px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px}
.embed .wrap{max-width:1760px}
.headrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin:0 0 14px}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.kicker{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg)}
h1{margin:0;font-size:clamp(28px,3.2vw,38px);line-height:1.15}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.lab{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:18px;align-items:stretch}
.haru{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line)}
.haru .face{display:flex;gap:14px;align-items:center}
.haru img{width:96px;height:96px;border-radius:50%;border:2px solid var(--line);background:#fff;object-fit:cover;flex:none}
.haru .who{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--violet);font-weight:700}
.haru h2{margin:2px 0 0;font-size:19px;line-height:1.3}
.haru p{margin:0;font-size:14.5px;color:var(--ink)}
.haru ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.haru li{position:relative;padding-left:16px;font-size:14px;color:var(--muted)}
.haru li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--violet)}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 8px 10px 2px}
.ep{flex:0 0 min(460px,86%);scroll-snap-align:start;display:flex;flex-direction:column;background:var(--scr);color:var(--scr-ink);border:2px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);overflow:hidden;text-decoration:none;transition:transform .15s,box-shadow .15s}
a.ep:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line)}
a.ep:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.ep .shot{position:relative;aspect-ratio:16/10;background:#0b111c;overflow:hidden}
.ep .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.ep .tag{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--scr-ink);border:1px solid #3a3a40;border-radius:99px;padding:2px 9px;background:rgba(0,0,0,.7)}
.ep .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ep h3{margin:0;font-size:20px;line-height:1.25}
.ep p{margin:0;font-size:14px;color:#c9c9cf}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:2px}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 20px var(--mono);font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--scr-mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:11.5px;color:var(--scr-mute);border:1px solid #34343a;border-radius:99px;padding:1px 9px}
.go{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:40px;padding:0 16px;border-radius:99px;background:var(--acc);color:#1f2224;font-weight:700;font-size:14px;margin-top:6px}
.ep.soon{background:var(--paper);color:var(--muted);border-style:dashed;box-shadow:none;justify-content:center;align-items:center;min-height:240px;text-align:center;padding:20px}
.ep.soon b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink)}
.foot{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.foot a{color:inherit}
@media (max-width:820px){.lab{grid-template-columns:minmax(0,1fr)}.haru{flex-direction:row;flex-wrap:wrap;align-items:center}.haru ul{display:none}}
@media (max-width:480px){.haru img{width:72px;height:72px}.ep{flex-basis:90%}}
@media (prefers-reduced-motion:reduce){a.ep{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="haru-lab">
  <div class="headrow">
    <div class="head"><span class="kicker" id="kicker">AHNBOAT LAB · HARU'S LAB</span><h1 id="title">하루의 실험실</h1></div>
    <span class="count" id="count"></span>
  </div>
  <div class="lab">
    <div class="haru">
      <div class="face"><img src="thumbs/chars/idphoto/haru_E07.webp" alt="실험조수 하루" width="96" height="96">
        <div><div class="who">실험조수 하루 · No.002</div><h2>숫자는 제가 직접 돌려서 가져와요</h2></div></div>
      <p id="intro">실험조수 하루가 AI 실험 하나를 직접 다시 돌리고, 나온 숫자와 그림으로 설명하는 연재입니다.</p>
      <ul>
        <li>한 회에 실험 하나, 같은 코드를 다시 돌려 숫자를 맞춰 봐요</li>
        <li>그림은 실제 계산 결과로만 그려요</li>
        <li>재현 코드와 데이터는 회차마다 저장소에 있어요</li>
      </ul>
    </div>
    <div class="row" id="row" aria-label="하루의 실험실 회차"></div>
  </div>
  <p class="foot">하루 그림: <a href="https://adminmrobo.github.io/fruitfly-lab-expressions/" target="_blank" rel="noopener">캐릭터 팩</a> · 새 회차는 오른쪽으로 쌓입니다.</p>
</div>
<script>
(function(){
  'use strict';
  var Q=new URLSearchParams(location.search);
  if(Q.get('embed')==='1')document.documentElement.classList.add('embed');
  if(Q.get('theme')==='dark'||Q.get('theme')==='light')document.documentElement.setAttribute('data-theme',Q.get('theme'));
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
  function post(){if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-catalog-height',height:Math.ceil(document.body.getBoundingClientRect().height),nav:false},'*');}catch(e){}}}
  function render(d){
    if(d.kicker)document.getElementById('kicker').textContent=d.kicker;
    if(d.title)document.getElementById('title').textContent=d.title;
    if(d.intro)document.getElementById('intro').textContent=d.intro;
    var row=document.getElementById('row');row.textContent='';
    var open=(d.episodes||[]).filter(function(e){return e.status!=='hidden';});
    document.getElementById('count').textContent='연재 '+open.length+'회';
    open.forEach(function(e){
      var a=el('a','ep');a.href=e.url;a.target='_blank';a.rel='noopener';
      var shot=el('div','shot');var im=el('img');im.src=e.thumb;im.alt=e.title+' 장면';im.loading='lazy';im.addEventListener('load',post);shot.appendChild(im);shot.appendChild(el('span','tag',e.ep+(e.date?' · '+e.date:'')));a.appendChild(shot);
      var b=el('div','body');b.appendChild(el('h3',null,e.title));b.appendChild(el('p',null,e.desc));
      var st=el('div','stats');(e.stats||[]).forEach(function(s,i){var x=el('div');var v=el('b',null,s[1]);if(i===0)v.style.color='var(--plain)';if(i===1)v.style.color='var(--drop)';x.appendChild(v);x.appendChild(el('span',null,s[0]));st.appendChild(x);});b.appendChild(st);
      var tg=el('div','tags');(e.tags||[]).forEach(function(t){tg.appendChild(el('span',null,t));});b.appendChild(tg);
      b.appendChild(el('span','go','실험실 들어가기 →'));a.appendChild(b);row.appendChild(a);
    });
    if(d.next){var s=el('div','ep soon');s.appendChild(el('b',null,'EP.'+String(open.length+1).padStart(2,'0')));s.appendChild(el('span',null,d.next));row.appendChild(s);}
    post();
  }
  fetch('data/haru_lab.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(render).catch(function(){document.getElementById('count').textContent='';post();});
  window.addEventListener('resize',post);
  if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
  post();
})();
</script>
</body>
</html>
