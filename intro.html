<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주인장은 누구? · Reon Ahn's page</title>
<meta name="description" content="Reon Ahn(안상선)과 연구실 식구들, Ahn Lab Town 입장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --line:#1f2224; --rule:#e4e0d8;
  --mint:#1f9e66; --pink:#d9668f; --sky:#2f6fbf; --sun:#e0a92a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.kicker{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:#fff}
h2{margin:0;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.15}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{border:2px solid var(--line);border-radius:20px;background:#fff;box-shadow:5px 5px 0 var(--line);overflow:hidden;min-width:0}
.me{padding:24px 26px;background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper);display:flex;flex-direction:column;gap:12px}
.me .nm{margin:0;font-size:1.6rem;font-weight:700;line-height:1.2}
.me .nm small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);margin-top:2px}
.me ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.me li{border:1.5px solid var(--line);border-radius:99px;padding:2px 11px;font-size:.85rem;background:#fff}
.me p{margin:0;color:var(--muted);font-size:.95rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:9px 16px;background:var(--sun);box-shadow:3px 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn.ghost{background:#fff}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.stage{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:300px;background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper)}
.line{display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2vw,28px);padding:56px 16px 0;position:relative}
.line::after{content:"";position:absolute;left:8%;right:8%;bottom:30px;height:14px;border-radius:50%;background:rgba(31,34,36,.08)}
.mate{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
.mate .crewsprite img{filter:drop-shadow(2px 2px 0 rgba(31,34,36,.12))}
.mate .tag{font-size:clamp(.66rem,1.6vw,.78rem);font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:1px 9px;white-space:nowrap;margin-bottom:12px}
.mate:hover .tag,.mate:focus-visible .tag{background:var(--sun)}
.say{position:absolute;top:14px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-size:.9rem;box-shadow:3px 3px 0 var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say b{font-size:.75rem;color:var(--muted);margin-right:6px}
.town{position:relative;display:block;text-decoration:none;height:clamp(180px,22vw,260px);margin-top:18px}
.town img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;image-rendering:pixelated}
.town .cap{position:absolute;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.town .cap .nm{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.town .cap small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.town .cap .go{background:var(--sun);border:2px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.town:hover img{filter:brightness(1.06)}
@media (max-width:900px){.top{grid-template-columns:1fr}.stage{min-height:260px}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span class="kicker">MEET ME</span><h2>주인장은 누구?</h2></div>
  <div class="top">
    <section class="card me" aria-label="주인장 소개">
      <p class="nm">안상선 <small>Reon Ahn · Ahn boat</small></p>
      <ul><li>경제학 박사</li><li>인공지능 연구</li><li>대학·기관 강의</li></ul>
      <p>어려운 개념을 박사·조수·초파리 연구원·주판봇이 진행하는 작은 실험으로 바꿔 보여 주는 연구실을 운영합니다. 학술적 주장은 논문으로, 콘텐츠는 함께 해 보는 해설로 만듭니다.</p>
      <div class="btns">
        <a class="btn" href="https://adminmrobo.github.io/ahn_boat_lab_town/" target="_blank" rel="noopener">🚪 Ahn Lab Town 입장하기</a>
        <a class="btn ghost" href="https://adminmrobo.github.io/who_am_i/who_am_i.html" target="_blank" rel="noopener">저자 소개 보기</a>
      </div>
    </section>
    <section class="card stage" aria-label="연구실 식구들 (눌러 보세요)">
      <p class="say" id="say" aria-live="polite"><b id="sayWho">조수 하루</b><span id="sayTxt">안녕하세요! 저희를 눌러 보세요.</span></p>
      <div class="line" id="crew"></div>
    </section>
  </div>
  <a class="card town" href="https://adminmrobo.github.io/ahn_boat_lab_town/" target="_blank" rel="noopener" aria-label="Ahn Lab Town 입장하기">
    <img src="thumbs/chars/labtown_map.webp" alt="">
    <span class="cap"><span class="nm">Ahn Lab Town<small>연구실 식구들이 일하는 마을 · 지하 1층 서버실</small></span><span class="go">🚪 입장하기</span></span>
  </a>
</div>
<script src="crew.js"></script>
<script>
(function(){
  'use strict';
  var CREW=[
    {k:'doctor',name:'박사',role:'DOCTOR',desc:'연구실을 이끌며 개념을 실험으로 풀어 줍니다.',lines:['어서 오게!','이건 실험해 보면 금방 알 수 있다네.','어디 보자… 데이터부터!']},
    {k:'haru',name:'조수 하루',role:'ASSISTANT',desc:'자료를 정리하고 콘텐츠 진행 상황을 챙깁니다.',lines:['안녕하세요!','정리 끝! 확인해 주세요.','해냈다!']},
    {k:'fruitfly',name:'초파리 연구원',role:'RESEARCHER',desc:'작은 몸으로 큰 데이터를 살피는 연구원입니다.',lines:['윙윙~','시작합니다!','음… 수상한데요?']},
    {k:'jupanbot',name:'주판봇',role:'ABABOT',desc:'주판으로 숫자를 세고 서버실 랙을 지킵니다.',lines:['딸깍딸깍, 계산 중.','만세! 계산 완료!']}
  ];
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  var box=document.getElementById('crew');
  function H(){return Math.max(90,Math.min(200,(box.clientWidth-60)/2.6));}
  function build(){
    box.textContent='';
    var order=['doctor','haru','jupanbot','fruitfly'],h=H();
    order.forEach(function(k){var c=CREW.filter(function(x){return x.k===k;})[0];
      var b=el('button','mate '+c.k);b.type='button';b.title=c.desc;b.setAttribute('aria-label',c.name+' — '+c.desc);
      c.sp=AhnCrew.make(c.k,h);b.appendChild(c.sp.el);b.appendChild(el('span','tag',c.name));c.n=c.n||0;
      b.addEventListener('click',function(){go(c);});box.appendChild(b);});
    post();
  }
  AhnCrew.load().then(function(){build();
    if(!reduce){var t=0;setInterval(function(){go(CREW[t%CREW.length]);t++;},2800);}
    var rw;window.addEventListener('resize',function(){clearTimeout(rw);rw=setTimeout(build,250);});
  });
  function go(c){c.n++;c.sp.act(c.n);document.getElementById('sayWho').textContent=c.name;document.getElementById('sayTxt').textContent=c.lines[c.n%c.lines.length];}
  function post(){if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-catalog-height',height:Math.ceil(document.body.getBoundingClientRect().height),nav:false},'*');}catch(e){}}}
  window.addEventListener('resize',post);document.querySelectorAll('img').forEach(function(im){im.addEventListener('load',post);});post();
})();
</script>
</body>
</html>
