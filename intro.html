<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주인장은 누구? · Reon Ahn's page</title>
<meta name="description" content="Reon Ahn(안상선)과 연구실 식구들, Ahn Lab Town 입장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --line:#1f2224; --rule:#e4e0d8;
  --mint:#1f9e66; --pink:#d9668f; --sky:#2f6fbf; --sun:#e0a92a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.kicker{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:#fff}
h2{margin:0;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.15}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{border:2px solid var(--line);border-radius:20px;background:#fff;box-shadow:5px 5px 0 var(--line);overflow:hidden;min-width:0}
.me{justify-content:center;padding:24px 26px;background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper);display:flex;flex-direction:column;gap:12px}
.me .nm{margin:0;font-size:1.6rem;font-weight:700;line-height:1.2}
.me .nm small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);margin-top:2px}
.me ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.me li{border:1.5px solid var(--line);border-radius:99px;padding:2px 11px;font-size:.85rem;background:#fff}
.me p{margin:0;color:var(--muted);font-size:.95rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;padding-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:9px 16px;background:var(--sun);box-shadow:3px 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn.ghost{background:#fff}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.ids{padding:18px 20px 20px;display:flex;flex-direction:column;justify-content:center;gap:12px;background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper)}
.ids .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ids .hd b{font-size:1.05rem}
.ids .hd span{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted)}
.say{margin:0 auto;width:100%;max-width:560px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.88rem;box-shadow:2px 2px 0 var(--line);min-height:2.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say b{font-size:.72rem;color:var(--muted);margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:560px;margin:0 auto}
.idc{display:flex;flex-direction:column;align-items:stretch;gap:0;background:#fff;border:2px solid var(--line);border-radius:8px;padding:5px 5px 7px;box-shadow:3px 3px 0 var(--line);cursor:pointer;font:inherit;color:inherit;text-align:left;min-width:0;transition:transform .12s}
.idc:hover{transform:translate(-1px,-2px) rotate(-.6deg)}
.idc .ph{position:relative;aspect-ratio:3/4;border-radius:5px;overflow:hidden;background:linear-gradient(#dfeaf6,#cfdff0);border:1.5px solid #b9cbe0}
.idc .ph img{position:absolute;left:50%;top:5%;width:134%;transform:translateX(-50%);image-rendering:pixelated}
.idc.fruitfly .ph img{top:12%;width:128%}
.idc.jupanbot .ph img{top:6%;width:128%}
.idc .no{position:absolute;left:5px;top:5px;font-family:var(--mono);font-size:.62rem;background:rgba(255,255,255,.85);border-radius:4px;padding:0 4px;color:var(--muted)}
.idc .nm{display:block;margin-top:6px;font-weight:700;font-size:.84rem;line-height:1.25;word-break:keep-all}
.idc .rl{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--muted)}
.idc.npc .ph{background:repeating-linear-gradient(45deg,#eef2f6 0 8px,#e3e9f0 8px 16px);display:flex;align-items:center;justify-content:center}
.idc.npc .q{font-size:2rem;font-weight:700;color:#9fb1c6}
.idc.npc .nm{color:var(--muted)}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.idc .nm{font-size:.8rem}}
@media (max-width:540px){.top{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.idc{transition:none}}
.town{position:relative;display:block;text-decoration:none;height:clamp(180px,22vw,260px);margin-top:18px}
.town img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;image-rendering:pixelated}
.town .cap{position:absolute;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.town .cap .nm{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.town .cap small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.town .cap .go{background:var(--sun);border:2px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.town:hover img{filter:brightness(1.06)}

@media (min-width:541px) and (max-width:900px){.me{padding:16px 16px;gap:9px}.me .nm{font-size:1.3rem}.me p{font-size:.86rem}.me li{font-size:.75rem}.btn{font-size:.8rem;padding:7px 10px}.ids{padding:14px 12px}.grid{gap:7px}.idc{padding:4px 4px 6px}.idc .nm{font-size:.74rem}.idc .rl{font-size:.55rem}.say{font-size:.8rem}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span class="kicker">MEET ME</span><h2>주인장은 누구?</h2></div>
  <div class="top">
    <section class="card me" aria-label="주인장 소개">
      <p class="nm">안상선 <small>Reon Ahn · Ahn boat</small></p>
      <ul><li>경제학 박사</li><li>인공지능 연구</li><li>대학·기관 강의</li></ul>
      <p>어려운 개념을 박사·조수·초파리 연구원·주판봇이 진행하는 작은 실험으로 바꿔 보여 주는 연구실을 운영합니다. 학술적 주장은 논문으로, 콘텐츠는 함께 해 보는 해설로 만듭니다.</p>
      <div class="btns">
        <a class="btn" href="https://adminmrobo.github.io/ahn_boat_lab_town/" target="_blank" rel="noopener">🚪 Ahn Lab Town 입장하기</a>
        <a class="btn ghost" href="https://adminmrobo.github.io/who_am_i/who_am_i.html" target="_blank" rel="noopener">저자 소개 보기</a>
      </div>
    </section>
    <section class="card ids" aria-label="연구실 식구 명부">
      <div class="hd"><b>연구실 식구 명부</b><span>AHNBOAT LAB · ID</span></div>
      <p class="say" id="say" aria-live="polite"><b id="sayWho">조수 하루</b><span id="sayTxt">사진을 눌러 보세요!</span></p>
      <div class="grid" id="crew"></div>
    </section>
  </div>
  <a class="card town" href="https://adminmrobo.github.io/ahn_boat_lab_town/" target="_blank" rel="noopener" aria-label="Ahn Lab Town 입장하기">
    <img src="thumbs/chars/labtown_map.webp" alt="">
    <span class="cap"><span class="nm">Ahn Lab Town<small>연구실 식구들이 일하는 마을 · 지하 1층 서버실</small></span><span class="go">🚪 입장하기</span></span>
  </a>
</div>
<script>
(function(){
  'use strict';
  var P='thumbs/chars/idphoto/',EX=['E13','E01','E07','E09','E12'];
  var CREW=[
    {k:'doctor',name:'박사',role:'DOCTOR',lines:['어서 오게!','이건 실험해 보면 금방 알 수 있다네.','어디 보자… 데이터부터!','흠, 이건 좀 더 생각해 봐야겠군.','좋아, 해 보세!']},
    {k:'haru',name:'조수 하루',role:'ASSISTANT',lines:['안녕하세요!','정리 끝! 확인해 주세요.','이렇게 하면 돼요!','음… 다시 볼게요.','해냈다!']},
    {k:'fruitfly',name:'초파리 연구원',role:'RESEARCHER',lines:['윙윙~','데이터 발견!','돋보기로 살펴보는 중.','음… 수상한데요?','만세!']},
    {k:'jupanbot',name:'주판봇',role:'ABABOT',lines:['딸깍딸깍.','계산 완료!','설명해 드릴게요.','숫자가 이상한데요?','열 개의 랙, 이상 없음!']},
    {k:'npc1',npc:true,name:'새 식구',role:'COMING SOON'},
    {k:'npc2',npc:true,name:'새 식구',role:'COMING SOON'}
  ];
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  var box=document.getElementById('crew'),live=CREW.filter(function(c){return !c.npc;});
  CREW.forEach(function(c,i){
    var b=el('button','idc '+c.k+(c.npc?' npc':''));b.type='button';
    var ph=el('span','ph');
    if(c.npc){ph.appendChild(el('span','q','?'));}
    else{c.img=el('img');c.img.alt='';c.img.src=P+c.k+'_'+EX[0]+'.webp';ph.appendChild(c.img);EX.forEach(function(e){var x=new Image();x.src=P+c.k+'_'+e+'.webp';});}
    ph.appendChild(el('span','no','No.'+String(i+1).padStart(3,'0')));
    b.appendChild(ph);b.appendChild(el('span','nm',c.name));b.appendChild(el('span','rl',c.role));
    b.setAttribute('aria-label',c.name+(c.npc?'':' — 눌러서 표정 보기'));
    c.n=0;b.addEventListener('click',function(){if(c.npc){say('주판봇','새 식구 사진은 곧 붙을 예정입니다!');return;}go(c);});
    box.appendChild(b);
  });
  function say(w,t){document.getElementById('sayWho').textContent=w;document.getElementById('sayTxt').textContent=t;}
  function go(c){c.n=(c.n+1)%EX.length;c.img.src=P+c.k+'_'+EX[c.n]+'.webp';say(c.name,c.lines[c.n%c.lines.length]);}
  if(!reduce){var t=0;setInterval(function(){go(live[t%live.length]);t++;},2600);}
  function post(){if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-catalog-height',height:Math.ceil(document.body.getBoundingClientRect().height),nav:false},'*');}catch(e){}}}
  window.addEventListener('resize',post);document.querySelectorAll('img').forEach(function(im){im.addEventListener('load',post);});post();
})();
</script>
</body>
</html>
