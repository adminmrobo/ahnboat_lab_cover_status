<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ontology Map · Reon Ahn's page</title>
<meta name="description" content="Reon Ahn(안상선) 연구실 해설 페이지들의 지식 색인을 분야별로 모은 3D 온톨로지 지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --rule:#e4e0d8; --line:#1f2224;
  --mint:#1f9e66; --pink:#d9668f; --sun:#e0a92a; --screen:#14191b; --gold:#f2c94c;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden;word-break:keep-all}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 28px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.back{font-size:.85rem;text-decoration:none;border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;background:#fff;box-shadow:2px 2px 0 var(--line)}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.lg{font-size:.74rem;font-weight:700;cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:2px 10px;background:#fff;box-shadow:2px 2px 0 var(--line)}
.lg[aria-pressed=true]{background:var(--ink);color:#fff}
.head{margin:18px 0 6px;display:flex;flex-direction:column;align-items:flex-start}
.kicker{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:#fff;margin:0 0 10px}
h1{margin:0;font-size:clamp(1.8rem,3.6vw,2.8rem);line-height:1.1}
.lede{margin:8px 0 0;color:var(--muted);max-width:70ch}
.kpis{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpis li{border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 14px;box-shadow:3px 3px 0 var(--line);min-width:0}
.kpis b{display:block;font-family:var(--mono);font-size:1.6rem;line-height:1.2}
.kpis span{font-size:.8rem;color:var(--muted)}
.fields{margin:18px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fc{text-align:left;cursor:pointer;border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;box-shadow:3px 3px 0 var(--line);min-width:0;display:flex;flex-direction:column;gap:4px}
.fc:hover{transform:translate(-1px,-1px)}
.fc[aria-pressed=true]{outline:3px solid var(--sun);outline-offset:1px}
.fc .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.fc .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.fc .ct{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fc .ct b{color:var(--ink)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{cursor:pointer;font-size:.85rem;border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;background:#fff;box-shadow:2px 2px 0 var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.mapbox{position:relative;margin:14px 0 0;border:2px solid var(--line);border-radius:18px;background:var(--screen);box-shadow:5px 5px 0 var(--line);overflow:hidden}
#g{width:100%;height:clamp(420px,72vh,860px)}
.bar{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.bar>*{pointer-events:auto}
.find{position:relative;flex:0 1 320px;min-width:200px}
.find input{width:100%;font:inherit;font-size:.9rem;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.sug{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:2px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;display:none}
.sug.on{display:block}
.sug button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:.88rem}
.sug button:hover,.sug button:focus{background:var(--paper)}
.sug .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sug small{color:var(--muted);margin-left:auto;white-space:nowrap}
.tb{cursor:pointer;font-size:.8rem;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.hint{position:absolute;left:12px;bottom:10px;color:#9fb0aa;font-size:.75rem;z-index:2;pointer-events:none}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-weight:700;font-size:.82rem;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;z-index:2}
.lbl.hub{font-size:.95rem;padding:2px 9px;border-radius:99px;border:1.5px solid #fff;background:rgba(20,25,27,.65);text-shadow:none}
.lbl.sel{color:var(--gold)}
.info{position:absolute;right:12px;top:60px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 72px);overflow:auto;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 var(--line);z-index:4}
.info[hidden]{display:none}
.info .x{float:right;border:0;background:none;font-size:1.1rem;cursor:pointer;line-height:1}
.info h2{margin:0 0 2px;font-size:1.15rem}
.info .en{color:var(--muted);font-size:.85rem;margin:0}
.info .ty{display:inline-block;font-family:var(--mono);font-size:.7rem;border:1.5px solid var(--line);border-radius:99px;padding:0 8px;margin:6px 0}
.info .df{margin:4px 0 8px;font-size:.9rem}
.info h3{font-size:.8rem;margin:10px 0 4px;color:var(--muted)}
.info ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.info li a{display:block;text-decoration:none;font-size:.86rem;border:1.5px solid var(--rule);border-radius:8px;padding:5px 8px}
.info li a:hover{border-color:var(--line)}
.info li a small{display:block;color:var(--muted);font-size:.74rem}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags button{cursor:pointer;font-size:.78rem;border:1.5px solid var(--line);border-radius:99px;padding:1px 9px;background:#fff}
.err{padding:40px 20px;color:#e8fff3;text-align:center}
.shared{margin:22px 0 0}
.shared h2{font-size:1.1rem;margin:0 0 8px}
.shared .tags button{font-size:.85rem;padding:3px 11px;box-shadow:2px 2px 0 var(--line)}
.shared .tags b{font-family:var(--mono);font-size:.72rem;margin-left:4px;color:var(--muted)}
.note{margin:22px 0 0;font-size:.8rem;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fields{grid-template-columns:minmax(0,1fr)}
  #g{height:62vh}
  .info{position:static;width:auto;max-height:none;margin:0;border-radius:0;border-width:2px 0 0;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="back" href="https://ahnboat.xyz/" target="_top">← Reon Ahn's page</a>
    <div class="langs" id="langs" role="group"></div>
  </div>
  <header class="head">
    <p class="kicker">ONTOLOGY MAP · 3D</p>
    <h1 id="ttl">분야별 온톨로지 지도</h1>
    <p class="lede" id="lede">연구실 해설 페이지마다 달린 지식 색인을 한데 모아, 분야 → 콘텐츠 → 개념으로 이어지는 3D 지도로 그렸습니다. 끌어서 돌리고, 굴려서 확대하고, 점을 누르면 그 개념이 나오는 페이지로 갈 수 있습니다.</p>
  </header>
  <ul class="kpis" id="kpis"></ul>
  <div class="fields" id="fields"></div>
  <div class="modes" id="modes"></div>
  <div class="mapbox" id="mapbox">
    <div id="g"></div>
    <div class="bar">
      <div class="find"><input id="q" type="search" autocomplete="off"><ul class="sug" id="sug"></ul></div>
      <button class="tb" id="reset" type="button"></button>
      <button class="tb" id="spin" type="button" aria-pressed="false"></button>
    </div>
    <p class="hint" id="hint"></p>
    <aside class="info" id="info" hidden></aside>
  </div>
  <section class="shared">
    <h2 id="shT">여러 분야를 잇는 개념</h2>
    <div class="tags" id="shared"></div>
  </section>
  <p class="note" id="note"></p>
</div>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<script>
(function(){
  'use strict';
  var T=AhnI18n.t;
  var D=null,PAGE={},NODE={},COLOR={},G=null,cur={field:null,mode:'all'},sel=null,hl=new Set(),labels=[],spin=false;
  var TYPE={Concept:'개념',Method:'방법',Term:'용어',Metric:'지표',Dataset:'데이터셋',Account:'계정과목',Standard:'기준',Identity:'항등식',Theory:'이론',BioAnalogue:'생물 비유',Assumption:'가정'};
  function $(id){return document.getElementById(id);}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function nm(n){return AhnI18n.lang==='ko'?n.ko:(n.en||n.ko);}
  function fmt(n){return Number(n).toLocaleString();}

  Promise.all([fetch('data/ontology.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}),AhnI18n.ready])
  .then(function(a){D=a[0];
    D.pages.forEach(function(p){PAGE[p.id]=p;});
    D.fields.forEach(function(f){COLOR[f.cat]=f.color;});
    D.nodes.forEach(function(n){NODE[n.id]=n;n.deg=0;});
    D.edges.forEach(function(e){NODE[e[0]].deg++;NODE[e[1]].deg++;});
    statics();build();
    var q=new URLSearchParams(location.search).get('concept');if(q){var hit=findNodes(q)[0];if(hit)setTimeout(function(){select('c:'+hit.id);},1500);}
  }).catch(function(){$('g').appendChild(el('p','err',T('지도 데이터를 불러오지 못했습니다.')));});

  /* 화면 글자 */
  function statics(){
    document.title=T('분야별 온톨로지 지도')+' · Reon Ahn\'s page';
    $('ttl').textContent=T('분야별 온톨로지 지도');
    $('lede').textContent=T('연구실 해설 페이지마다 달린 지식 색인을 한데 모아, 분야 → 콘텐츠 → 개념으로 이어지는 3D 지도로 그렸습니다. 끌어서 돌리고, 굴려서 확대하고, 점을 누르면 그 개념이 나오는 페이지로 갈 수 있습니다.');
    $('q').placeholder=T('개념 찾기 (예: 과적합, 역전파)');$('q').setAttribute('aria-label',T('개념 찾기'));
    $('reset').textContent='⟲ '+T('처음 시점');
    $('spin').textContent=(spin?'⏸ ':'▶ ')+T('자동 회전');
    $('hint').textContent=T('끌기: 돌리기 · 휠/두 손가락: 확대 · 점 누르기: 자세히');
    $('shT').textContent=T('여러 분야를 잇는 개념');
    var g=$('langs');g.textContent='';g.setAttribute('aria-label',T('언어'));
    AhnI18n.langs.forEach(function(l){var b=el('button','lg',AhnI18n.names[l]);b.type='button';b.setAttribute('aria-pressed',String(l===AhnI18n.lang));b.addEventListener('click',function(){AhnI18n.set(l);});g.appendChild(b);});
    if(!D)return;
    var s=D.summary,k=$('kpis');k.textContent='';
    [[s.fields,'분야'],[s.contents,'콘텐츠'],[s.pages,'해설 페이지'],[s.concepts,'개념'],[s.relations,'개념 사이 관계'],[s.shared,'여러 분야를 잇는 개념']].forEach(function(x){
      var li=el('li');li.appendChild(el('b','',fmt(x[0])));li.appendChild(el('span','',T(x[1])));k.appendChild(li);});
    var f=$('fields');f.textContent='';
    D.fields.forEach(function(x){var b=el('button','fc');b.type='button';b.setAttribute('aria-pressed',String(cur.field===x.cat));
      var n=el('span','nm');var d=el('span','dot');d.style.background=x.color;n.appendChild(d);n.appendChild(el('span','',T(x.cat)));b.appendChild(n);
      var c=el('span','ct');c.innerHTML=T('콘텐츠 {0} · 페이지 {1} · 개념 {2} · 관계 {3}','<b>'+x.contents+'</b>','<b>'+x.pages+'</b>','<b>'+fmt(x.concepts)+'</b>','<b>'+fmt(x.relations)+'</b>');b.appendChild(c);
      b.addEventListener('click',function(){cur.field=cur.field===x.cat?null:x.cat;statics();build();});f.appendChild(b);});
    var m=$('modes');m.textContent='';
    [['all','전체 지도'],['shared','분야를 잇는 개념만']].forEach(function(x){var b=el('button','chip',T(x[1]));b.type='button';b.setAttribute('aria-pressed',String(cur.mode===x[0]));
      b.addEventListener('click',function(){cur.mode=x[0];statics();build();});m.appendChild(b);});
    if(cur.field){var b=el('button','chip','✕ '+T('분야 선택 풀기'));b.type='button';b.addEventListener('click',function(){cur.field=null;statics();build();});m.appendChild(b);}
    var sh=$('shared');sh.textContent='';
    D.nodes.filter(function(n){return n.c.length>1;}).sort(function(a,b){return b.c.length-a.c.length||b.p.length-a.p.length;}).slice(0,24).forEach(function(n){
      var b=el('button','',nm(n));b.type='button';b.appendChild(el('b','',T('{0}개 분야',n.c.length)));b.addEventListener('click',function(){
        if(cur.field&&n.c.indexOf(cur.field)<0){cur.field=null;statics();build();}
        select('c:'+n.id);$('mapbox').scrollIntoView({behavior:'smooth',block:'center'});});sh.appendChild(b);});
    $('note').textContent=T('매일 오전 6시에 각 해설 페이지의 지식 색인(#kg)을 다시 모아 갱신합니다. 마지막 갱신: {0}',D.updated);
    if(sel)info(sel);
  }

  /* 지도 데이터: 분야(허브) → 페이지 → 개념, 개념끼리 관계 */
  function graph(){
    var nodes=[],links=[],have={};
    function add(n){have[n.id]=n;nodes.push(n);}
    var fs=D.fields.filter(function(f){return !cur.field||f.cat===cur.field;}),R=fs.length>1?380:0;
    fs.forEach(function(f,i){var a=i/fs.length*Math.PI*2;add({id:'f:'+f.cat,k:'hub',cat:f.cat,color:f.color,fx:R*Math.cos(a),fy:R*Math.sin(a),fz:(i%2?1:-1)*R*0.25});});
    var pin={};
    D.nodes.forEach(function(n){
      if(cur.mode==='shared'&&n.c.length<2)return;
      var ps=n.p.filter(function(x){var p=PAGE[x[0]];return p&&(!cur.field||p.cat===cur.field);});
      if(!ps.length)return;
      var c=(cur.field||n.c[0]);
      add({id:'c:'+n.id,k:'c',ref:n,cat:c,multi:n.c.length>1});
      ps.forEach(function(x){pin[x[0]]=1;links.push({source:'p:'+x[0],target:'c:'+n.id,k:'pc'});});
    });
    D.pages.forEach(function(p){if(!pin[p.id])return;add({id:'p:'+p.id,k:'page',ref:p,cat:p.cat});links.push({source:'f:'+p.cat,target:'p:'+p.id,k:'fp',cat:p.cat});});
    D.edges.forEach(function(e){if(have['c:'+e[0]]&&have['c:'+e[1]])links.push({source:'c:'+e[0],target:'c:'+e[1],k:'cc',rel:e[2]});});
    return {nodes:nodes,links:links};
  }
  function ncolor(n){
    var dim=hl.size&&!hl.has(n.id);
    var c=n.k==='c'&&n.multi?'#f2c94c':(COLOR[n.cat]||'#999');
    if(n.k==='page')c=lighten(c,.35);
    return dim?'#262d2f':c;
  }
  function lighten(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
    function m(x){return Math.round(x+(255-x)*a);}return 'rgb('+m(r)+','+m(g)+','+m(b)+')';}
  function nval(n){return n.k==='hub'?30:n.k==='page'?7:(1+Math.min(8,(n.ref.p.length-1)*0.8+(n.multi?2:0)));}
  function lcolor(l){
    var on=hl.size&&hl.has(l.source.id||l.source)&&hl.has(l.target.id||l.target);
    if(hl.size&&!on)return 'rgba(255,255,255,0.03)';
    if(l.k==='fp')return COLOR[l.cat]||'#888';
    if(l.k==='cc')return on?'#ffffff':'rgba(255,255,255,0.35)';
    return on?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.10)';
  }
  function tip(n){
    if(n.k==='hub')return '<b>'+esc(T(n.cat))+'</b>';
    if(n.k==='page')return '<b>'+esc(T(n.ref.content))+'</b>'+(AhnI18n.lang==='ko'?'<br>'+esc(n.ref.title):'');
    return '<b>'+esc(nm(n.ref))+'</b><br><small>'+esc(T(TYPE[n.ref.t]||n.ref.t))+'</small>';
  }

  var hubs=[],overlay=null,fitted=false;
  function build(){
    if(!D)return;
    if(typeof ForceGraph3D!=='function'){if(!$('g').querySelector('.err'))$('g').appendChild(el('p','err',T('이 브라우저에서는 3D 지도를 그릴 수 없습니다. 아래 분야별 총계와 개념 목록을 이용해 주세요.')));return;}
    var data=graph();
    if(!G){
      G=ForceGraph3D({controlType:'orbit'})($('g'))
        .backgroundColor('#14191b').showNavInfo(false).nodeOpacity(0.92).nodeResolution(10)
        .linkOpacity(0.6).linkWidth(function(l){return l.k==='fp'?0.8:0;})
        .cooldownTicks(260).warmupTicks(30)
        .onNodeClick(function(n){select(n.id);})
        .onBackgroundClick(function(){unselect();})
        .onEngineStop(function(){if(!fitted){fitted=true;G.zoomToFit(900,30);}});
      G.d3Force('charge').strength(function(n){return n.k==='hub'?-900:n.k==='page'?-60:-14;});
      G.d3Force('link').distance(function(l){return l.k==='fp'?90:l.k==='pc'?26:18;}).strength(function(l){return l.k==='cc'?0.25:l.k==='pc'?0.35:0.7;});
      overlay=el('div');overlay.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:2';$('mapbox').appendChild(overlay);
      requestAnimationFrame(tick);
      new ResizeObserver(function(){G.width($('g').clientWidth).height($('g').clientHeight);}).observe($('g'));
      G.controls().autoRotateSpeed=0.6;
    }
    G.nodeColor(ncolor).nodeVal(nval).linkColor(lcolor).nodeLabel(tip).graphData(data);
    hubs=data.nodes.filter(function(n){return n.k==='hub';});
    sel=null;hl=new Set();$('info').hidden=true;
    fitted=false;
  }
  function tick(){
    if(G&&overlay){
      var show=hubs.slice();if(sel){var s=G.graphData().nodes.find(function(n){return n.id===sel;});if(s)show.push(s);}
      while(labels.length<show.length){var d=el('div','lbl');overlay.appendChild(d);labels.push(d);}
      labels.forEach(function(d,i){var n=show[i];if(!n||n.x==null){d.style.display='none';return;}
        var p=G.graph2ScreenCoords(n.x,n.y,n.z);d.style.display='';d.style.transform='translate('+Math.round(p.x)+'px,'+Math.round(p.y)+'px) translate(-50%,-50%)';
        var t=n.k==='hub'?T(n.cat):n.k==='page'?T(n.ref.content):nm(n.ref);if(d.textContent!==t)d.textContent=t;
        d.className='lbl'+(n.k==='hub'?' hub':' sel');if(n.k==='hub')d.style.borderColor=n.color;
        if(p.x<-50||p.y<-50||p.x>overlay.clientWidth+50||p.y>overlay.clientHeight+50)d.style.display='none';});
    }
    requestAnimationFrame(tick);
  }
  function neighbors(id){
    var s=new Set([id]);G.graphData().links.forEach(function(l){var a=l.source.id||l.source,b=l.target.id||l.target;if(a===id)s.add(b);if(b===id)s.add(a);});return s;
  }
  function select(id){
    if(!G)return;
    var n=G.graphData().nodes.find(function(x){return x.id===id;});
    if(!n){if(cur.mode==='shared'||cur.field){cur.mode='all';cur.field=null;statics();build();setTimeout(function(){select(id);},2400);}return;}
    sel=id;hl=neighbors(id);G.nodeColor(ncolor).linkColor(lcolor);
    if(n.x!=null){var c=G.cameraPosition(),dx=c.x-n.x,dy=c.y-n.y,dz=c.z-n.z,L=Math.hypot(dx,dy,dz)||1,k=Math.min(950,Math.max(n.k==='hub'?650:520,L*0.7))/L;
      G.cameraPosition({x:n.x+dx*k,y:n.y+dy*k,z:n.z+dz*k},{x:n.x,y:n.y,z:n.z},1200);}
    info(id);
  }
  function unselect(){sel=null;hl=new Set();if(G)G.nodeColor(ncolor).linkColor(lcolor);$('info').hidden=true;}
  function pageLink(p,anchor){
    var a=el('a');a.href=p.url+(anchor||'');a.target='_blank';a.rel='noopener';
    a.appendChild(document.createTextNode(T(p.content)));if(AhnI18n.lang==='ko'){if(p.title&&p.title!==p.content)a.appendChild(el('small','',p.title));}else{var f=decodeURIComponent(p.url.split('/').pop()||'index.html').replace(/\.html?$/,'');a.appendChild(el('small','',f));}
    return a;}
  function info(id){
    var box=$('info'),n=G&&G.graphData().nodes.find(function(x){return x.id===id;});if(!n)return;
    box.textContent='';var x=el('button','x','✕');x.type='button';x.setAttribute('aria-label',T('닫기'));x.addEventListener('click',unselect);box.appendChild(x);
    if(n.k==='hub'){var f=D.fields.find(function(f){return f.cat===n.cat;});
      box.appendChild(el('h2','',T(n.cat)));
      box.appendChild(el('p','df',T('콘텐츠 {0} · 페이지 {1} · 개념 {2} · 관계 {3}',f.contents,f.pages,fmt(f.concepts),fmt(f.relations))));
      box.appendChild(el('h3','',T('이 분야의 해설 페이지')));var ul=el('ul');
      D.pages.filter(function(p){return p.cat===n.cat;}).forEach(function(p){ul.appendChild(el('li')).appendChild(pageLink(p,''));});box.appendChild(ul);
    }else if(n.k==='page'){var p=n.ref;
      box.appendChild(el('h2','',T(p.content)));if(AhnI18n.lang==='ko'&&p.title!==p.content)box.appendChild(el('p','en',p.title));
      box.appendChild(el('span','ty',T(p.cat)));
      box.appendChild(el('p','df',T('이 페이지의 개념 {0}개',p.n)));
      var a=pageLink(p,'#kg');a.firstChild.textContent=T('이 페이지의 지식 색인 열기')+' →';var ul2=el('ul');ul2.appendChild(el('li')).appendChild(a);box.appendChild(ul2);
    }else{var c=n.ref;
      box.appendChild(el('h2','',nm(c)));
      if(AhnI18n.lang==='ko'&&c.en)box.appendChild(el('p','en',c.en));else if(AhnI18n.lang!=='ko'&&c.en)box.appendChild(el('p','en',c.ko));
      box.appendChild(el('span','ty',T(TYPE[c.t]||c.t)));
      if(AhnI18n.lang==='ko'&&c.def)box.appendChild(el('p','df',c.def));
      box.appendChild(el('h3','',T('분야')));var tg=el('div','tags');
      c.c.forEach(function(k){var b=el('button','',T(k));b.type='button';b.style.borderColor=COLOR[k]||'';b.addEventListener('click',function(){cur.field=k;statics();build();setTimeout(function(){select('c:'+c.id);},2400);});tg.appendChild(b);});box.appendChild(tg);
      box.appendChild(el('h3','',T('이 개념이 나오는 페이지 ({0})',c.p.length)));var ul3=el('ul');
      c.p.forEach(function(x){var p=PAGE[x[0]];if(p)ul3.appendChild(el('li')).appendChild(pageLink(p,x[1]));});box.appendChild(ul3);
      var nb=[];D.edges.forEach(function(e){if(e[0]===c.id)nb.push(e[1]);else if(e[1]===c.id)nb.push(e[0]);});
      nb=nb.filter(function(v,i,a){return a.indexOf(v)===i&&NODE[v];}).slice(0,16);
      if(nb.length){box.appendChild(el('h3','',T('이어진 개념')));var t2=el('div','tags');
        nb.forEach(function(v){var b=el('button','',nm(NODE[v]));b.type='button';b.addEventListener('click',function(){select('c:'+v);});t2.appendChild(b);});box.appendChild(t2);}
    }
    box.hidden=false;box.scrollTop=0;
  }

  /* 개념 찾기 */
  function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'');}
  function findNodes(q){q=norm(q);if(!q)return [];
    var out=D.nodes.filter(function(n){return norm(n.ko).indexOf(q)>=0||norm(n.en).indexOf(q)>=0;});
    out.sort(function(a,b){var ea=norm(a.ko)===q||norm(a.en)===q,eb=norm(b.ko)===q||norm(b.en)===q;return (eb-ea)||(b.p.length-a.p.length);});
    return out.slice(0,10);}
  var qi=$('q'),sug=$('sug');
  qi.addEventListener('input',function(){sug.textContent='';if(!D)return;var r=findNodes(qi.value);
    r.forEach(function(n){var b=el('button');b.type='button';var d=el('span','dot');d.style.background=n.c.length>1?'#f2c94c':COLOR[n.c[0]];b.appendChild(d);
      b.appendChild(el('span','',nm(n)));b.appendChild(el('small','',T(n.c[0])+(n.c.length>1?' +'+(n.c.length-1):'')));
      b.addEventListener('click',function(){sug.classList.remove('on');qi.value=nm(n);
        if(cur.field&&n.c.indexOf(cur.field)<0||cur.mode==='shared'&&n.c.length<2){cur.field=null;cur.mode='all';statics();build();setTimeout(function(){select('c:'+n.id);},2400);}else select('c:'+n.id);});
      sug.appendChild(el('li')).appendChild(b);});
    if(!r.length&&qi.value.trim())sug.appendChild(el('li','',T('찾는 개념이 없습니다.'))).style.padding='6px 8px';
    sug.classList.toggle('on',!!qi.value.trim());});
  qi.addEventListener('keydown',function(e){if(e.key==='Enter'){var f=sug.querySelector('button');if(f)f.click();}if(e.key==='Escape')sug.classList.remove('on');});
  document.addEventListener('click',function(e){if(!e.target.closest('.find'))sug.classList.remove('on');});
  $('reset').addEventListener('click',function(){unselect();if(G)G.zoomToFit(800,40);});
  $('spin').addEventListener('click',function(){spin=!spin;if(G)G.controls().autoRotate=spin;this.setAttribute('aria-pressed',String(spin));statics();});
  AhnI18n.onChange(function(){statics();if(G)G.nodeLabel(tip);});
  AhnI18n.ready.then(statics);
})();
</script>
