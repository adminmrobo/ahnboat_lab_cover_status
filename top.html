<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reon Ahn's page</title>
<meta name="description" content="Reon Ahn(안상선)의 연구실 홈페이지 첫 화면 — 공지와 연구실 식구들">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --rule:#e4e0d8; --line:#1f2224;
  --mint:#1f9e66; --pink:#d9668f; --sky:#2f6fbf; --sun:#e0a92a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px}
.hero{position:relative;border:2px solid var(--line);border-radius:22px;background:
  radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper);
  box-shadow:6px 6px 0 var(--line);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:end;min-height:300px}
.htext{padding:30px 32px 30px;align-self:center}
.kicker{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:#fff;margin:0 0 12px}
h1{margin:0;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.05;letter-spacing:-.01em}
.tag{margin:8px 0 0;font-size:1.15rem;color:var(--muted)}
.boat{margin:14px 0 0;font-size:.9rem;color:var(--muted)}
.boat b{color:var(--ink)}
.stats{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:10px 0 0;border-top:1.5px dashed var(--rule);max-width:560px}
.stats[hidden]{display:none}
.stats li{display:flex;align-items:baseline;gap:6px}
.stats b{font-family:var(--mono);font-size:1.35rem;line-height:1}
.stats span{font-size:.8rem;color:var(--muted)}
/* 왼쪽 위 서울 시계(대한민국 표준시) + 음악 버튼 (data/music.json — 관리실 '음악' 탭) */
.clk{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px;padding:4px 6px 4px 12px;border:1.5px solid var(--line);border-radius:99px;background:#1f2224;color:#f2c744;font-family:var(--mono);font-size:.78rem;line-height:1.4;box-shadow:2px 2px 0 var(--line)}
.clk .cz{font-size:.66rem;letter-spacing:.1em;color:#c9c3b4}
.clk time{font-weight:700;letter-spacing:.03em;color:#fff}
.clk .mbtn{font:inherit;font-size:.72rem;width:24px;height:24px;border-radius:50%;border:1.5px solid #f2c744;background:#2c3033;color:#f2c744;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.clk .mbtn[hidden],.clk .mtt[hidden]{display:none}
.clk .mbtn:hover{background:#f2c744;color:#1f2224}
.clk .mtt{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7rem;color:#c9c3b4;padding-right:6px}

.langs{display:flex;flex-wrap:wrap;gap:8px 8px;margin-top:16px}
.langs .lg{font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:3px 11px;background:#fff;color:var(--ink);box-shadow:2px 2px 0 var(--line)}
.langs .lg[aria-pressed=true]{background:var(--ink);color:#fff}
.langs .lg:hover{transform:translate(-1px,-1px)}
/* 언어 버튼 아래 번역률 (data/i18n_status.json — 표지 현황 수집 때 갱신) */
.langs .lgw{display:flex;flex-direction:column;align-items:center;gap:8px}
.langs .pct{font-family:var(--mono,ui-monospace,monospace);font-size:.68rem;line-height:1;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:3.2em}
.langs .pct i{display:block;width:100%;height:3px;border-radius:99px;background:var(--rule);overflow:hidden}
.langs .pct i b{display:block;height:100%;background:var(--ink)}
.langs .lgcap{flex-basis:100%;font-size:.7rem;color:var(--muted);margin-top:2px}
.langs .lgcap[hidden]{display:none}
.crew{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(0px,1vw,14px);padding:20px 16px 10px;height:100%}
.crew::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:16px;border-radius:50%;background:rgba(31,34,36,.08)}
.mate{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.part{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;flex:none}
.part img{display:block;width:auto;filter:drop-shadow(2px 3px 0 rgba(31,34,36,.10))}
.part.jupanbot img{animation:bob 2.4s ease-in-out infinite}
.part.fruitfly img{animation:float 3s ease-in-out infinite}
.part.hop{animation:hop .5s ease}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes hop{30%{transform:translateY(-10px)}60%{transform:none}}
@media (prefers-reduced-motion:reduce){.part img,.part.hop{animation:none}}
.mate .nm{position:absolute;bottom:-2px;transform:translateY(100%);font-size:.7rem;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s}
.mate:hover .nm,.mate:focus-visible .nm{opacity:1}
.say{position:absolute;top:14px;right:16px;max-width:min(320px,70%);background:#fff;border:2px solid var(--line);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:.85rem;box-shadow:3px 3px 0 var(--line);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none}
.say.on{opacity:1;transform:none}
.say b{display:block;font-size:.7rem;color:var(--muted)}
/* 바로가기 배지 — 내 아이디어 검증하기 (ahnboat_ontology_feed) */
.idea{position:absolute;top:14px;right:16px;z-index:3;display:flex;align-items:center;gap:10px;max-width:min(340px,44%);text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:5px 12px 5px 6px;box-shadow:3px 3px 0 var(--line);transition:transform .15s,box-shadow .15s}
.idea:hover,.idea:focus-visible{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.idea .ipx{flex:none;width:48px;height:48px;border-radius:10px;background:var(--paper) url(https://adminmrobo.github.io/ahnboat_ontology_feed/assets/char/asst_spark.webp) center/cover no-repeat;image-rendering:pixelated}
.idea .itx{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.idea .itx b{font-size:.88rem}
.idea .itx small{font-size:.72rem;color:var(--muted)}
.idea .inew{flex:none;align-self:flex-start;font-family:var(--mono);font-size:.6rem;font-weight:700;color:#fff;background:var(--pink);border-radius:5px;padding:0 5px;margin-top:2px}
.crew .say{top:84px}
.notice{margin-top:16px;border:2px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:stretch;overflow:hidden;box-shadow:4px 4px 0 var(--line)}
.notice .lb{flex:none;display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);font-weight:700;padding:0 16px;border-right:2px solid var(--line);font-size:.92rem}
.notice ul{list-style:none;margin:0;padding:6px 6px;flex:1;min-width:0;display:flex;flex-direction:column}
.notice li a{display:flex;gap:12px;align-items:baseline;text-decoration:none;padding:6px 10px;border-radius:10px}
.notice li a:hover{background:var(--paper)}
.notice time{font-family:var(--mono);font-size:.78rem;color:var(--muted);flex:none}
.notice .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice .nedit{flex:none;display:flex;align-items:center;justify-content:center;padding:0 12px;text-decoration:none;font-size:.95rem;opacity:.45;border-left:2px dashed var(--line)}
.notice .nedit:hover,.notice .nedit:focus-visible{opacity:1;background:var(--paper)}
.notice .new{font-family:var(--mono);font-size:.66rem;font-weight:700;color:#fff;background:var(--pink);border-radius:5px;padding:0 5px;flex:none}
.find{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-width:560px}
.find form{flex:1 1 240px;display:flex;min-width:0;border:2px solid var(--line);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--line);overflow:hidden}
.find input{flex:1;min-width:0;font:inherit;font-size:.9rem;border:0;padding:7px 12px;background:transparent;outline-offset:-3px}
.find form button{flex:none;cursor:pointer;font:inherit;border:0;border-left:2px solid var(--line);background:var(--sun);padding:0 12px}
.find .map{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.85rem;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#14191b;color:#fff;box-shadow:3px 3px 0 var(--line)}
.find .map:hover,.find form:focus-within{transform:translate(-1px,-1px)}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .htext{padding:22px 20px 4px}
  .crew{padding-top:66px}
  .idea{position:static;margin:12px 20px 0;max-width:none;justify-self:start}
  .crew .say{top:14px}
  .notice{flex-direction:column}
  .notice .lb{padding:8px 14px;border-right:0;border-bottom:2px solid var(--line)}
  .notice .t{white-space:normal}
  .notice .nedit{border-left:0;border-top:2px dashed var(--line);padding:6px 12px;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){.say{transition:none}}
</style>

<body>
<div class="wrap">
  <section class="hero" aria-labelledby="ttl">
    <div class="htext">
      <div class="clk" id="clk" aria-live="off"><span class="cz">SEOUL</span><time id="clkT"></time><span class="cz">KST</span><button type="button" class="mbtn" id="mBtn" hidden aria-label="음악 재생">▶</button><span class="mtt" id="mTt" hidden></span></div>
      <p class="kicker">AHNBOAT LAB</p>
      <h1 id="ttl">Reon Ahn's page</h1>
      <p class="tag">Small but interesting things.</p>
      <p class="boat"><b>Ahn boat</b> = 안(Ahn) + 상선(商船, boat). <span id="boatTxt">연구실 식구들을 태운 작은 배입니다.</span></p>
      <ul class="stats" id="stats" hidden></ul>
      <div class="langs" id="langs" role="group" aria-label="언어"></div>
      <div class="find">
        <form id="sf" action="search.html" target="_blank" role="search"><input id="sq" name="q" type="search" autocomplete="off"><button type="submit" id="sgo">🔍</button></form>
        <a class="map" id="omap" href="ontology.html" target="_blank" rel="noopener">🧭 <span id="omapT">온톨로지 3D 지도</span></a>
      </div>
    </div>
    <a class="idea" id="idea" href="https://adminmrobo.github.io/ahnboat_ontology_feed/" target="_blank" rel="noopener">
      <span class="ipx" aria-hidden="true"></span>
      <span class="itx"><b id="ideaT">🧪 연구실 도구함</b><small id="ideaS">아이디어 검증 · 결과물 평가 →</small></span>
      <span class="inew">NEW</span>
    </a>
    <div class="crew" id="crew" aria-label="연구실 식구들 (눌러 보세요)">
      <p class="say" id="say" aria-live="polite"><b id="sayWho"></b><span id="sayTxt"></span></p>
    </div>
  </section>
  <section class="notice" aria-labelledby="nlb">
    <span class="lb" id="nlb">📢 공지</span>
    <ul id="nlist"><li><a href="#"><span class="t">공지를 불러오는 중…</span></a></li></ul>
    <a class="nedit" href="admin.html#notice" target="_blank" rel="noopener" title="공지 쓰기 (관리자)" aria-label="공지 쓰기 (관리자)">✏️</a>
  </section>
</div>
<script src="i18n.js"></script>
<script>
(function(){
  'use strict';
  var T=AhnI18n.t;
  var LINES={doctor:['어서 오게! 오늘은 어떤 실험을 해 볼까?','개념은 실험으로 풀면 쉬워진다네.','논문 해설은 아래 Articles에 있다네.'],
    haru:['안녕하세요! 새 소식은 아래 공지에 있어요.','콘텐츠 진행 상황은 Progress Board에서 볼 수 있어요.','Lab Server의 랙을 눌러 보세요!'],
    jupanbot:['딸깍딸깍, 콘텐츠 수를 세는 중입니다.','열 개의 랙, 이상 없음!'],
    fruitfly:['윙윙~ 작은 몸으로 큰 데이터를 살펴봐요.','딥러닝 랙에는 제 특별편도 있어요!'],
    sia:['인턴 시아입니다. 오늘 판정은 제가 맡아요.','자료는 순서대로 정리해 뒀어요.','…졸지 않았어요. 정말이에요.'],
    moa:['인턴 모아예요! 차 한 잔 하실래요?','새 식구 소개는 식구 명부에 있어요!','힘내세요! 제가 응원할게요!']};
  var NAME={doctor:'박사',haru:'조수 하루',jupanbot:'주판봇',fruitfly:'초파리 연구원',sia:'인턴 시아',moa:'인턴 모아'};
  var crew=document.getElementById('crew'),say=document.getElementById('say');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  var sayT;
  function speak(w){document.getElementById('sayWho').textContent=T(NAME[w]);
    document.getElementById('sayTxt').textContent=T(LINES[w][Math.floor(Math.random()*LINES[w].length)]);
    say.classList.add('on');clearTimeout(sayT);sayT=setTimeout(function(){say.classList.remove('on');},3200);}
  /* 연구 장면 그림(배경 없는 4장: 박사·하루 / 시아·모아 / 주판봇 / 초파리). 키 비율은 박사 1.0 기준으로 맞춰 둠 */
  var LAYER={labpair:{h:1.0011,lift:0},interns:{h:0.82,lift:0},jupanbot:{h:0.7025,lift:0.012},fruitfly:{h:0.5294,lift:0.076}};
  var PAIR={labpair:['doctor','haru'],interns:['sia','moa']};
  var parts={};
  function H(){var w=crew.clientWidth||window.innerWidth;return Math.max(96,Math.min(250,(w-40)/3.05));}
  function build(){
    crew.querySelectorAll('.part').forEach(function(n){n.remove();});
    var h=H();
    ['labpair','interns','jupanbot','fruitfly'].forEach(function(k){
      var b=el('button','part '+k);b.type='button';
      b.setAttribute('aria-label',PAIR[k]?T(NAME[PAIR[k][0]])+' · '+T(NAME[PAIR[k][1]]):T(NAME[k]));
      var im=el('img');im.alt='';im.src='thumbs/chars/hero/'+k+'.webp';im.style.height=Math.round(LAYER[k].h*h)+'px';
      b.style.marginBottom=Math.round(LAYER[k].lift*h)+'px';b.appendChild(im);
      b.addEventListener('click',function(e){
        var w=k;if(PAIR[k]){var r=b.getBoundingClientRect();w=PAIR[k][(e.clientX-r.left)<r.width*0.5?0:1];}
        hop(b);speak(w);});
      crew.insertBefore(b,say);parts[k]=b;
    });
    post();
  }
  function hop(b){if(reduce)return;b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop');}
  build();
  if(!reduce){var order=['haru','doctor','moa','jupanbot','sia','fruitfly'],t=0,OF={doctor:'labpair',haru:'labpair',sia:'interns',moa:'interns'};
    setInterval(function(){var w=order[t%order.length];speak(w);hop(parts[OF[w]||w]);t++;},4200);}
  var rw;window.addEventListener('resize',function(){clearTimeout(rw);rw=setTimeout(build,250);});

  // 공지: data/notices.csv + data/notices_auto.csv (날짜, 제목, 링크, 표시) — 최근 4개
  function parseCSV(t){
    var rows=[],row=[],f='',q=false;t=t.replace(/^﻿/,'');
    for(var i=0;i<t.length;i++){var ch=t[i];
      if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=ch;}
      else if(ch=='"')q=true;else if(ch==','){row.push(f);f='';}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=ch;}
    if(f||row.length){row.push(f);rows.push(row);}
    var h=rows.shift()||[];return rows.filter(function(r){return r.join('').trim();}).map(function(r){var o={};h.forEach(function(k,i){o[k.trim()]=(r[i]||'').trim();});return o;});
  }
  var NOTI=null;
  // 손으로 쓴 공지(notices.csv) + 업데이트 이력에서 자동으로 만든 공지(notices_auto.csv, scripts/build_updates.py)
  var autoN=fetch('data/notices_auto.csv',{cache:'no-cache'}).then(function(r){return r.ok?r.text():'';}).then(function(t){return t?parseCSV(t):[];}).catch(function(){return [];});
  fetch('data/notices.csv',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(t){var m=parseCSV(t);return autoN.then(function(a){NOTI=m.concat(a);return AhnI18n.ready;});}).then(notices)
  .catch(function(){var ul=document.getElementById('nlist');ul.textContent='';ul.appendChild(el('li')).appendChild(el('span','t',T('공지를 불러오지 못했습니다.')));});
  function notices(){if(!NOTI)return;
    var off={};NOTI.forEach(function(n){if((n['표시']||'Y').toUpperCase()==='N')off[n['날짜']+'|'+n['제목']]=1;});  // 손 공지 N이 같은 날짜·제목 자동 공지를 숨긴다
    var list=NOTI.filter(function(n){return (n['표시']||'Y').toUpperCase()!=='N'&&n['제목']&&!off[n['날짜']+'|'+n['제목']];})
      .sort(function(a,b){return (b['날짜']||'').localeCompare(a['날짜']||'');}).slice(0,4);
    var ul=document.getElementById('nlist');ul.textContent='';
    if(!list.length){ul.appendChild(el('li','',null)).appendChild(el('span','t',T('새 공지가 없습니다.')));}
    list.forEach(function(n){
      var li=el('li');var a=el('a');a.href=n['링크']||'#';a.target='_top';
      var tm=el('time','',(n['날짜']||'').slice(5).replace('-','.'));tm.dateTime=n['날짜']||'';a.appendChild(tm);
      var d=n['날짜']?(Date.now()-Date.parse(n['날짜']))/864e5:99;if(d<7)a.appendChild(el('span','new','NEW'));
      a.appendChild(el('span','t',TN(n['제목'])));li.appendChild(a);ul.appendChild(li);
    });
    post();
  }
  /* 연구실 규모 한 줄: 분야·콘텐츠(공개 카탈로그) · 개념(온톨로지 지도) · 언어 — 매일 수집 때 함께 바뀐다 */
  var STAT=null;
  function getJ(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
  Promise.all([getJ('data/catalog.json'),getJ('data/ontology.json').catch(function(){return null;})]).then(function(a){
    var c=a[0]||{},o=(a[1]&&a[1].summary)||{};
    STAT=[['규모:분야',(c.categories||[]).length],['규모:콘텐츠',(c.items||[]).length],['규모:개념',o.concepts||0],['규모:언어',AhnI18n.langs.length]];
    return AhnI18n.ready;}).then(stats).catch(function(){});
  function stats(){if(!STAT)return;var ul=document.getElementById('stats');ul.textContent='';
    var loc=AhnI18n.lang==='zh'?'zh-CN':AhnI18n.lang;
    STAT.forEach(function(x){if(!x[1])return;var li=el('li');li.appendChild(el('b','',Number(x[1]).toLocaleString(loc)));li.appendChild(el('span','',T(x[0]).replace(/^규모:/,'')));ul.appendChild(li);});
    ul.hidden=!ul.children.length;ul.setAttribute('aria-label',T('연구실 규모'));post();}
  /* 언어별 콘텐츠 번역률 — 받아 오면 언어 버튼을 다시 그린다 */
  var I18S=null;
  getJ('data/i18n_status.json').then(function(d){I18S=d;return AhnI18n.ready;}).then(function(){statics();post();}).catch(function(){});
  /* 언어 고르기 — 고르면 아래 블록이 모두 함께 바뀐다 */
  function statics(){
    document.getElementById('boatTxt').textContent=T('연구실 식구들을 태운 작은 배입니다.');
    document.getElementById('crew').setAttribute('aria-label',T('연구실 식구들 (눌러 보세요)'));
    document.getElementById('nlb').textContent=T('📢 공지');
    document.getElementById('sq').placeholder=T('콘텐츠 찾아보기 (제목·개념)');document.getElementById('sq').setAttribute('aria-label',T('콘텐츠 찾아보기'));
    document.getElementById('sgo').setAttribute('aria-label',T('찾기'));
    document.getElementById('omapT').textContent=T('온톨로지 3D 지도');
    var IDEA={ko:['🧪 연구실 도구함','아이디어 검증 · 결과물 평가 →',''],
      en:['🧪 Lab Toolbox','Idea check · Work review →','Opens pages in Korean'],
      zh:['🧪 研究室工具箱','想法验证 · 成果评估 →','打开韩文页面'],
      ja:['🧪 研究室ツールボックス','アイデア検証 · 成果物の評価 →','韓国語のページが開きます'],
      uz:['🧪 Laboratoriya asboblari','G‘oyani tekshirish · Natijani baholash →','Koreyscha sahifa ochiladi'],
      ru:['🧪 Инструменты лаборатории','Проверка идеи · Оценка результата →','Откроется страница на корейском'],
      vi:['🧪 Hộp công cụ phòng lab','Kiểm chứng ý tưởng · Đánh giá kết quả →','Mở trang tiếng Hàn']};
    var it=IDEA[AhnI18n.lang]||IDEA.ko;
    document.getElementById('ideaT').textContent=it[0];document.getElementById('ideaS').textContent=it[1];
    document.getElementById('idea').title=it[2]||'';
    document.getElementById('omap').title=T('분야별 온톨로지 3D 지도');
    var g=document.getElementById('langs');g.setAttribute('aria-label',T('언어'));g.textContent='';
    AhnI18n.langs.forEach(function(l){var b=el('button','lg',AhnI18n.names[l]);b.type='button';b.lang=l;b.setAttribute('aria-pressed',String(l===AhnI18n.lang));
      b.addEventListener('click',function(){AhnI18n.set(l);});var w=el('span','lgw');w.appendChild(b);
      var v=I18S&&I18S.langs&&I18S.langs[l];
      if(v){var r=Math.round(v.rate*1000)/10,p=el('small','pct',(r>=10||r===0?Math.round(r):r)+'%'),bar=el('i'),fill=el('b');fill.style.width=r+'%';bar.appendChild(fill);p.appendChild(bar);
        p.title=T('공개 콘텐츠 {0}개 중 이 언어로 옮긴 비율 (일부만 옮긴 콘텐츠는 옮긴 페이지 비율로 셈)',I18S.contents);w.appendChild(p);}
      g.appendChild(w);});
    if(I18S&&I18S.langs){var cap=el('span','lgcap',T('콘텐츠 번역률'));cap.title=T('공개 콘텐츠 {0}개 중 이 언어로 옮긴 비율 (일부만 옮긴 콘텐츠는 옮긴 페이지 비율로 셈)',I18S.contents);g.appendChild(cap);}
    build();
  }
  /* 공지 제목 번역 — 통째로 사전에 있으면 그것, 자동 공지('업데이트 — 콘텐츠 제목')는 머리말과 콘텐츠 제목을 따로 번역해 잇는다 */
  function TN(t){var x=T(t);if(x!==t)return x;var m=/^(업데이트|새 콘텐츠 공개) — (.+)$/.exec(t);return m?T(m[1])+' — '+T(m[2]):t;}
  /* 서울 시계 — 방문자 시간대와 상관없이 대한민국 표준시(Asia/Seoul) */
  function clock(){var t=document.getElementById('clkT');if(!t)return;var d=new Date(),L=(window.AhnI18n&&AhnI18n.lang)||'ko';
    try{var f=new Intl.DateTimeFormat(L==='ko'?'ko-KR':L,{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(d),g={};f.forEach(function(p){g[p.type]=p.value;});
      var hm=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
      t.textContent=g.month+'.'+g.day+' ('+g.weekday+') '+hm;}
    catch(e){var k=new Date(d.getTime()+9*3600e3);t.textContent=k.toISOString().slice(5,10).replace('-','.')+' '+k.toISOString().slice(11,16);}
    t.dateTime=d.toISOString();}
  clock();setTimeout(function(){clock();setInterval(clock,60000);},60000-Date.now()%60000+50);
  /* 음악 — 방문자가 ▶를 눌러야 재생(브라우저 자동 재생 제한). 곡이 끝나면 다음 곡. */
  (function(){var btn=document.getElementById('mBtn'),tt=document.getElementById('mTt'),M=null,au=null,i=0,order=[];
    function cur(){return M.tracks[order[i]];}
    function load(){var t=cur();au.src=t.url;tt.textContent='♪ '+(t.title||'OST');tt.title=(t.title||'')+(t.credit?' — '+t.credit:'');}
    function ui(on){btn.textContent=on?'❚❚':'▶';btn.setAttribute('aria-label',on?'음악 멈춤':'음악 재생');tt.hidden=!on;post();}
    fetch('data/music.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(m){
      if(!m||!m.enabled)return;m.tracks=(m.tracks||[]).filter(function(t){return t&&t.url&&t.on!==false;});if(!m.tracks.length)return;M=m;
      order=M.tracks.map(function(_,k){return k;});
      if(M.order==='shuffle')for(var k=order.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),x=order[k];order[k]=order[j];order[j]=x;}
      au=new Audio();au.preload='none';au.volume=Math.max(0,Math.min(1,Number(M.volume)||0.5));
      au.addEventListener('ended',function(){if(M.order==='one'){au.currentTime=0;au.play();return;}i=(i+1)%order.length;load();au.play().catch(function(){ui(false);});});
      au.addEventListener('pause',function(){ui(false);});au.addEventListener('play',function(){ui(true);});
      load();btn.hidden=false;post();
      btn.addEventListener('click',function(){if(au.paused)au.play().catch(function(){ui(false);});else au.pause();});
    }).catch(function(){});})();
  AhnI18n.onChange(function(){statics();notices();stats();clock();});
  AhnI18n.ready.then(function(){statics();AhnI18n.announce();});
  function post(){if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-catalog-height',height:Math.ceil(document.body.getBoundingClientRect().height),nav:false},'*');}catch(e){}}}
  window.addEventListener('resize',post);
  document.querySelectorAll('img').forEach(function(im){im.addEventListener('load',post);});
  post();
})();
</script>
</body>
