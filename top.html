<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reon Ahn's page</title>
<meta name="description" content="Reon Ahn(안상선)의 연구실 홈페이지 첫 화면 — 공지와 연구실 식구들">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --rule:#e4e0d8; --line:#1f2224;
  --mint:#1f9e66; --pink:#d9668f; --sky:#2f6fbf; --sun:#e0a92a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px}
.hero{position:relative;border:2px solid var(--line);border-radius:22px;background:
  radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper);
  box-shadow:6px 6px 0 var(--line);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:end;min-height:300px}
.htext{padding:30px 32px 30px;align-self:center}
.kicker{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:#fff;margin:0 0 12px}
h1{margin:0;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.05;letter-spacing:-.01em}
.tag{margin:8px 0 0;font-size:1.15rem;color:var(--muted)}
.boat{margin:14px 0 0;font-size:.9rem;color:var(--muted)}
.boat b{color:var(--ink)}
.crew{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,1.6vw,22px);padding:20px 16px 0;height:100%}
.crew::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:16px;border-radius:50%;background:rgba(31,34,36,.08)}
.mate{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.mate img{display:block;width:auto;image-rendering:pixelated;transform-origin:50% 100%;filter:drop-shadow(2px 2px 0 rgba(31,34,36,.12))}
.mate.doc img{height:clamp(130px,17vw,210px)}
.mate.asst img{height:clamp(124px,16vw,200px)}
.mate.robo img{height:clamp(84px,10.5vw,132px)}
.mate.fly img{height:clamp(70px,9vw,112px);margin-bottom:clamp(30px,5vw,60px)}
.mate.hop img{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-10px) scale(1.02)}60%{transform:translateY(0)}}
.mate .nm{position:absolute;bottom:-2px;transform:translateY(100%);font-size:.7rem;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s}
.mate:hover .nm,.mate:focus-visible .nm{opacity:1}
.say{position:absolute;top:14px;right:16px;max-width:min(320px,70%);background:#fff;border:2px solid var(--line);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:.85rem;box-shadow:3px 3px 0 var(--line);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none}
.say.on{opacity:1;transform:none}
.say b{display:block;font-size:.7rem;color:var(--muted)}
.notice{margin-top:16px;border:2px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:stretch;overflow:hidden;box-shadow:4px 4px 0 var(--line)}
.notice .lb{flex:none;display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);font-weight:700;padding:0 16px;border-right:2px solid var(--line);font-size:.92rem}
.notice ul{list-style:none;margin:0;padding:6px 6px;flex:1;min-width:0;display:flex;flex-direction:column}
.notice li a{display:flex;gap:12px;align-items:baseline;text-decoration:none;padding:6px 10px;border-radius:10px}
.notice li a:hover{background:var(--paper)}
.notice time{font-family:var(--mono);font-size:.78rem;color:var(--muted);flex:none}
.notice .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice .new{font-family:var(--mono);font-size:.66rem;font-weight:700;color:#fff;background:var(--pink);border-radius:5px;padding:0 5px;flex:none}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .htext{padding:22px 20px 4px}
  .crew{padding-top:6px}
  .notice{flex-direction:column}
  .notice .lb{padding:8px 14px;border-right:0;border-bottom:2px solid var(--line)}
  .notice .t{white-space:normal}
}
@media (prefers-reduced-motion:reduce){.mate.hop img{animation:none}.say{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" aria-labelledby="ttl">
    <div class="htext">
      <p class="kicker">AHNBOAT LAB</p>
      <h1 id="ttl">Reon Ahn's page</h1>
      <p class="tag">Small but interesting things.</p>
      <p class="boat"><b>Ahn boat</b> = 안(Ahn) + 상선(商船, boat). 연구실 식구들을 태운 작은 배입니다.</p>
    </div>
    <div class="crew" id="crew" aria-label="연구실 식구들 (눌러 보세요)">
      <p class="say" id="say" aria-live="polite"><b id="sayWho"></b><span id="sayTxt"></span></p>
    </div>
  </section>
  <section class="notice" aria-labelledby="nlb">
    <span class="lb" id="nlb">📢 공지</span>
    <ul id="nlist"><li><a href="#"><span class="t">공지를 불러오는 중…</span></a></li></ul>
  </section>
</div>
<script>
(function(){
  'use strict';
  var P='thumbs/chars/pose/';
  var CREW=[
    {k:'doc',name:'박사',poses:['doc_ok','doc_think','doc_write','doc_data','doc_flask','doc_rush'],
     lines:['어서 오게! 오늘은 어떤 실험을 해 볼까?','개념은 실험으로 풀면 쉬워진다네.','논문 해설은 아래 Articles에 있다네.']},
    {k:'asst',name:'조수 하루',poses:['asst_wave','asst_idea','asst_present','asst_type','asst_check','asst_cheer','asst_think'],
     lines:['안녕하세요! 새 소식은 아래 공지에 있어요.','콘텐츠 진행 상황은 Progress Board에서 볼 수 있어요.','Lab Server의 랙을 눌러 보세요!']},
    {k:'fly',name:'초파리 연구원',poses:['fly_hover','fly_idea','fly_report','fly_scan','fly_analyze'],
     lines:['윙윙~ 작은 몸으로 큰 데이터를 살펴봐요.','딥러닝 랙에는 제 특별편도 있어요!']},
    {k:'robo',name:'주판봇',poses:['robo_scan','robo_search','robo_delivery','robo_dance','robo_battery'],
     lines:['딸깍딸깍, 콘텐츠 수를 세는 중입니다.','열 개의 랙, 이상 없음!']}
  ];
  var crew=document.getElementById('crew'),say=document.getElementById('say');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  var order=[CREW[0],CREW[1],CREW[3],CREW[2]];  // 박사, 하루, 주판봇, 초파리 (키 순서)
  var mates=order.map(function(c){
    var b=el('button','mate '+c.k);b.type='button';b.setAttribute('aria-label',c.name);
    var im=el('img');im.alt='';im.src=P+c.poses[0]+'.webp';b.appendChild(im);b.appendChild(el('span','nm',c.name));
    c.i=0;c.img=im;c.btn=b;
    b.addEventListener('click',function(){next(c,true);});
    crew.insertBefore(b,say);return c;
  });
  // 미리 받아 두기
  CREW.forEach(function(c){c.poses.forEach(function(p){var i=new Image();i.src=P+p+'.webp';});});
  var sayT;
  function speak(c){
    document.getElementById('sayWho').textContent=c.name;
    document.getElementById('sayTxt').textContent=c.lines[Math.floor(Math.random()*c.lines.length)];
    say.classList.add('on');clearTimeout(sayT);sayT=setTimeout(function(){say.classList.remove('on');},3200);
  }
  function next(c,talk){
    c.i=(c.i+1)%c.poses.length;c.img.src=P+c.poses[c.i]+'.webp';
    if(!reduce){c.btn.classList.remove('hop');void c.btn.offsetWidth;c.btn.classList.add('hop');}
    if(talk)speak(c);
  }
  if(!reduce){var turn=0;setInterval(function(){var c=mates[turn%mates.length];next(c,turn%3===1);turn++;},2600);}

  // 공지: data/notices.csv (날짜, 제목, 링크, 표시)
  function parseCSV(t){
    var rows=[],row=[],f='',q=false;t=t.replace(/^﻿/,'');
    for(var i=0;i<t.length;i++){var ch=t[i];
      if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=ch;}
      else if(ch=='"')q=true;else if(ch==','){row.push(f);f='';}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=ch;}
    if(f||row.length){row.push(f);rows.push(row);}
    var h=rows.shift()||[];return rows.filter(function(r){return r.join('').trim();}).map(function(r){var o={};h.forEach(function(k,i){o[k.trim()]=(r[i]||'').trim();});return o;});
  }
  fetch('data/notices.csv',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(t){
    var list=parseCSV(t).filter(function(n){return (n['표시']||'Y').toUpperCase()!=='N'&&n['제목'];})
      .sort(function(a,b){return (b['날짜']||'').localeCompare(a['날짜']||'');}).slice(0,3);
    var ul=document.getElementById('nlist');ul.textContent='';
    if(!list.length){ul.appendChild(el('li','',null)).appendChild(el('span','t','새 공지가 없습니다.'));}
    list.forEach(function(n){
      var li=el('li');var a=el('a');a.href=n['링크']||'#';a.target='_top';
      var tm=el('time','',(n['날짜']||'').slice(5).replace('-','.'));tm.dateTime=n['날짜']||'';a.appendChild(tm);
      var d=n['날짜']?(Date.now()-Date.parse(n['날짜']))/864e5:99;if(d<7)a.appendChild(el('span','new','NEW'));
      a.appendChild(el('span','t',n['제목']));li.appendChild(a);ul.appendChild(li);
    });
    post();
  }).catch(function(){var ul=document.getElementById('nlist');ul.textContent='';ul.appendChild(el('li')).appendChild(el('span','t','공지를 불러오지 못했습니다.'));});
  function post(){if(window.parent!==window){try{window.parent.postMessage({type:'ahnboat-catalog-height',height:Math.ceil(document.body.getBoundingClientRect().height),nav:false},'*');}catch(e){}}}
  window.addEventListener('resize',post);
  document.querySelectorAll('img').forEach(function(im){im.addEventListener('load',post);});
  post();
})();
</script>
</body>
</html>
